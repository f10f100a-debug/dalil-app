<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختبار خريطة دليل</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui;background:#111;color:#fff}#map{position:fixed;inset:0;overflow:hidden;background:#222}
.tile{position:absolute;width:256px;height:256px;image-rendering:auto}.panel{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));right:12px;left:12px;background:#10251fdd;border:1px solid #ffffff22;border-radius:16px;padding:12px;backdrop-filter:blur(10px)}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;background:#e6b85c;color:#172019}.small{font-size:12px;opacity:.8;margin-top:6px}
#dot{display:none;position:absolute;z-index:10;width:18px;height:18px;border-radius:50%;background:#2f8cff;border:3px solid white;box-shadow:0 0 0 6px #2f8cff44;transform:translate(-50%,-50%)}
</style></head><body>
<div id="map"><div id="dot"></div></div>
<div class="panel"><b>دليل — اختبار خريطة البر</b><br><button id="gps">📍 أظهر موقعي</button><div id="status" class="small">الخريطة التجريبية: المستوى العام فقط</div></div>
<script>
const Z=7,S=256,map=document.getElementById('map'), dot=document.getElementById('dot');
const xmin=76,xmax=82,ymin=52,ymax=58;
function worldXY(lat,lng){
 let n=2**Z, x=(lng+180)/360*n*S;
 let r=lat*Math.PI/180, y=(1-Math.asinh(Math.tan(r))/Math.PI)/2*n*S;
 return [x,y];
}
const originX=xmin*S, originY=ymin*S;
for(let x=xmin;x<=xmax;x++)for(let y=ymin;y<=ymax;y++){
 let im=new Image(); im.className='tile'; im.src=`tiles/7/${x}/${y}.png`;
 im.style.left=(x*S-originX)+'px'; im.style.top=(y*S-originY)+'px'; map.appendChild(im);
}
function centerOn(lat,lng){
 const [wx,wy]=worldXY(lat,lng), px=wx-originX,py=wy-originY;
 const tx=innerWidth/2-px,ty=innerHeight/2-py;
 map.querySelectorAll('.tile').forEach(im=>{const l=parseFloat(im.style.left),t=parseFloat(im.style.top); im.style.transform=`translate(${tx}px,${ty}px)`});
 dot.style.display='block';dot.style.left=(px+tx)+'px';dot.style.top=(py+ty)+'px';
}
document.getElementById('gps').onclick=()=>{
 document.getElementById('status').textContent='جاري طلب GPS…';
 navigator.geolocation.getCurrentPosition(p=>{
  let {latitude:lat,longitude:lng,accuracy}=p.coords; centerOn(lat,lng);
  document.getElementById('status').textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)} — دقة ±${Math.round(accuracy)}م`;
 },e=>document.getElementById('status').textContent='تعذر GPS: '+e.message,{enableHighAccuracy:true,timeout:15000});
};
</script></body></html>
