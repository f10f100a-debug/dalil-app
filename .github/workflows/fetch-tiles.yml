name: fetch-tiles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          exec > >(tee out.txt) 2>&1
          mkdir -p o
          curl -s "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/1.0.0/WMTSCapabilities.xml" -o cap.xml; grep -o "<ows:Identifier>[^<]*[Ff]lood[^<]*</ows:Identifier>\|<ows:Identifier>[^<]*[Ww]ater[^<]*</ows:Identifier>" cap.xml | sort -u | head -30
          for L in MODIS_Combined_Flood_2-Day MODIS_Combined_Flood_3-Day MODIS_Terra_Flood_2-Day; do
            curl -s -o o/$L.png -w "$L %{http_code} %{content_type} %{size_download}\n" "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/$L/default/2026-10-19/GoogleMapsCompatible_Level9/6/27/13.png"; done
          for y in tiles2021 tiles2020 tiles; do curl -s -o o/jrc_$y.png -w "jrc $y %{http_code} %{content_type} %{size_download}\n" "https://storage.googleapis.com/global-surface-water/$y/occurrence/8/157/108.png"; done
          curl -sI "https://storage.googleapis.com/global-surface-water/tiles2021/occurrence/8/157/108.png" | grep -i "access-control\|^HTTP"
          for z in 10 11 12; do python3 -c "
          import math;z=$z;lat,lng=27.85,42.10;n=2**z;print(z,int((lng+180)/360*n),int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n))" ; done > xy.txt; cat xy.txt
          while read z x y; do curl -s -o o/jrc_z$z.png -w "jrc z$z %{http_code} %{size_download}\n" "https://storage.googleapis.com/global-surface-water/tiles2021/occurrence/$z/$x/$y.png"; curl -s -o o/jrcs_z$z.png -w "jrc seas z$z %{http_code} %{size_download}\n" "https://storage.googleapis.com/global-surface-water/tiles2021/seasonality/$z/$x/$y.png"; done < xy.txt
          mv out.txt o/ && cd o && git init -q && git checkout -q -b tiles-check && git config user.email ci@d && git config user.name ci && git add . && git commit -qm r && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tiles-check
