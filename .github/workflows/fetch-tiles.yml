name: fetch-tiles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          exec > >(tee out.txt) 2>&1
          K='AAPTatkMipdolOCvDpKma6kIVOw..wlsdT9BdetJCVtO4DWoy5pUo54zFWEJnWuYTZEvo_oSIpIr3RNbs110CfirZZYgVLGXkElTaIzrpYNEj1dewVb5wB6ZK-gXxldqY6tDOFiiScSHP7R5uKjEixLBQO59zcYOMDAuF5eS31uRfnGm0mEKzuBtNC79DeuoxLIYbMTvEX2FrHM0c381e_95pdIxaHBYfd_ZQf8vNv-gsZo4QJbnlHYykKYCY-BahqC_2V6ZV2EjD_pTjPEHj4DnkxUAGg-QfWA4.AT1_6XPB1ypy'
          curl -s -o /dev/null -w "tile %{http_code} %{content_type}\n" -H "Referer: https://f10f100a-debug.github.io/" "https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/14/6870/10104?token=$K"
          curl -s -H "Referer: https://f10f100a-debug.github.io/" "https://route-api.arcgis.com/arcgis/rest/services/World/Route/NAServer/Route_World/solve?f=json&returnDirections=false&token=$K&stops=41.66,27.49;42.10,27.80" | python3 -c "import sys,json;j=json.load(sys.stdin);print('route',j.get('error') or j['routes']['features'][0]['attributes']['Total_Kilometers'])"
          curl -s -o /dev/null -w "badref %{http_code}\n" -H "Referer: https://evil.example.com/" "https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/14/6870/10104?token=$K"
          mkdir o && mv out.txt o/ && cd o && git init -q && git checkout -q -b tiles-check && git config user.email ci@d && git config user.name ci && git add . && git commit -qm r && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tiles-check
