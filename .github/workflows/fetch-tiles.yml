name: fetch-tiles
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          exec > >(tee out.txt) 2>&1
          J=$(curl -s https://api.rainviewer.com/public/weather-maps.json)
          echo "$J" | head -c 600; echo
          H=$(echo "$J" | python3 -c "import sys,json;j=json.load(sys.stdin);print(j['host']+j['radar']['past'][-1]['path'])")
          curl -sI -H "Origin: https://f10f100a-debug.github.io" "$H/256/7/78/54/2/1_1.png" | grep -iE "^HTTP|access-control|content-type"
          curl -sI -H "Origin: https://f10f100a-debug.github.io" "https://api.rainviewer.com/public/weather-maps.json" | grep -iE "^HTTP|access-control"
          curl -s -o z8.png -w "z8 %{http_code} %{size_download}\n" "$H/256/8/157/108/2/1_1.png"
          mkdir o && mv out.txt o/ && cd o && git init -q && git checkout -q -b tiles-check && git config user.email ci@d && git config user.name ci && git add . && git commit -qm r && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tiles-check
