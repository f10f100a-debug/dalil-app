# فحص غرفة الرحلة الحي (14 نوفمبر): جوالين وهميين على الخادم الحقيقي — إنشاء، دخول، مواقع، صوت، خروج.
# يشتغل كل يوم + يدوي + بعد أي تعديل على room.js أو دالة الغرف. أي مشكلة → data/room-qa.md → إشعار جوال المطوّر.
name: Room QA
on:
  push:
    branches: [main]
    paths: ["room.js", "supabase/functions/dalil-rooms/**", "tools/qa/room_check.js"]
  schedule: [{ cron: "47 7 * * *" }]
  workflow_dispatch:
concurrency: { group: room-qa, cancel-in-progress: true }
jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --silent playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - name: Room
        id: room
        continue-on-error: true
        run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          OUT=qa-room node tools/qa/room_check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: room-screens, path: qa-room/ }
      - name: Publish result
        if: always()
        run: |
          if [ "${{ steps.room.outcome }}" = failure ]; then cp qa-room/room-qa.md data/room-qa.md; else rm -f data/room-qa.md; fi
          git config user.email ci@dalil && git config user.name "dalil-bot"
          git add -A data/room-qa.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "فحص غرفة الرحلة: نتيجة $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
