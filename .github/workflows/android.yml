# بناء تطبيق دليل للأندرويد (Capacitor) على GitHub.
# - التشغيل اليدوي: يبني ملف APK تجريبي ويضعه في فرع android-build ليُحمَّل ويُثبَّت مباشرة على أي جوال أندرويد.
# - التطبيق يفتح نفس صفحة دليل على الإنترنت (مثل تطبيق الآيفون)، فأي تحديث للموقع يصل للأندرويد فورًا.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار الظاهر للمستخدم"
        type: string
        default: "1.0"
      release:
        description: "بناء ملف AAB موقّع لمتجر Google Play (يحتاج السر ANDROID_KEY_PASS)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version || '1.0' }}
      VERSION_CODE: ${{ github.run_number }}
      RELEASE: ${{ inputs.release && 'yes' || 'no' }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor (Android)
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/android@^7

      - name: Generate Android project
        run: |
          run_logged () { "$@" > "$RUNNER_TEMP/step.log" 2>&1 || { cat "$RUNNER_TEMP/step.log"; echo "::error::$(tail -25 "$RUNNER_TEMP/step.log" | paste -sd '|' -)"; exit 1; }; cat "$RUNNER_TEMP/step.log"; }
          # هوية خاصة بالأندرويد (DalilAndroid) حتى تفرّق الصفحة بينه وبين تطبيق الآيفون
          node -e 'const f="capacitor.config.json",c=require("./"+f);c.appendUserAgent="DalilAndroid/"+process.env.VERSION_NAME;c.android={backgroundColor:"#F2EFE9",allowMixedContent:false,adjustMarginsForEdgeToEdge:"force"};require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
          run_logged npx cap add android
          run_logged npx cap sync android

      - name: Name, icon, splash, permissions, version
        run: |
          set -e
          R=android/app/src/main/res
          # الاسم
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">دليل</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">دليل</string>#' $R/values/strings.xml
          # الأيقونة وشاشة البداية (sharp لأن ImageMagick غير متوفر على أجهزة GitHub الجديدة)
          rm -rf $R/mipmap-anydpi-v26
          npm install --no-audit --no-fund --no-save sharp@0.33 >/dev/null
          R=$R node -e '
            const sharp=require("sharp"),fs=require("fs"),path=require("path"),R=process.env.R;
            (async()=>{
              for(const [n,s] of [["mdpi",48],["hdpi",72],["xhdpi",96],["xxhdpi",144],["xxxhdpi",192]]){
                for(const f of ["ic_launcher","ic_launcher_round"]) await sharp("resources/icon-1024.png").resize(s,s).png().toFile(path.join(R,"mipmap-"+n,f+".png"));
                fs.rmSync(path.join(R,"mipmap-"+n,"ic_launcher_foreground.png"),{force:true});
              }
              const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
              for(const f of walk(R).filter(f=>path.basename(f)==="splash.png")){
                const m=await sharp(f).metadata();
                const buf=await sharp("resources/splash-2732x2732.png").resize(m.width,m.height,{fit:"cover"}).png().toBuffer();
                fs.writeFileSync(f,buf);
              }
              console.log("icons + splash ok");
            })().catch(e=>{console.error(e);process.exit(1)});'
          # الأذونات: الموقع (البوصلة والتوجيه)، الميكروفون (غرفة الرحلة)، الكاميرا (صورة/فيديو حدث)، الاهتزاز
          M=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA VIBRATE POST_NOTIFICATIONS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<uses-permission android:name=\"android.permission.INTERNET\" />#&\n    <uses-permission android:name=\"android.permission.$p\" />#" $M
          done
          grep -q 'android.hardware.location.gps' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          # رقم الإصدار
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" $G
          grep -n "applicationId\|versionCode\|versionName" $G
          grep -n "uses-permission\|uses-feature" $M
          echo "::notice::Android $VERSION_NAME ($VERSION_CODE) — UserAgent DalilAndroid/$VERSION_NAME"

      - name: جسر دليل الأصلي — إبقاء الشاشة شغالة، فتح الإعدادات، وغرفة الرحلة في الخلفية (1.3)
        run: |
          set -e
          J=android/app/src/main/java/com/alluhaybi/dalil
          test -f $J/MainActivity.java
          # الواجهة window.DalilAndroid تنضاف قبل تحميل الصفحة (من load() في إضافة Capacitor)
          cat > $J/DalilNative.java <<'JAVA'
          package com.alluhaybi.dalil;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.HashSet;
          import java.util.Set;

          @CapacitorPlugin(name = "DalilNative")
          public class DalilNative extends Plugin {
              private final Set<String> awake = new HashSet<>();
              private final Handler h = new Handler(Looper.getMainLooper());
              private boolean room = false;   // غرفة الرحلة شغالة (من الصفحة: DalilRoom.active)
              private boolean bg = false;     // التطبيق بالخلفية

              @Override public void load() {
                  WebView wv = getBridge().getWebView();
                  getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface public int version() { return 2; }
                      // إبقاء الشاشة شغالة وقت التوجيه وتسجيل المسار (src: main أو map)
                      @JavascriptInterface public void keepAwake(String src, boolean on) {
                          getActivity().runOnUiThread(() -> {
                              String k = src == null ? "main" : src;
                              if (on) awake.add(k); else awake.remove(k);
                              if (awake.isEmpty()) getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              else getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          });
                      }
                      // صفحة دليل في إعدادات الجوال (لو رفض إذن الموقع أو التنبيهات)
                      @JavascriptInterface public void openSettings() {
                          getActivity().runOnUiThread(() -> {
                              Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.fromParts("package", getContext().getPackageName(), null));
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              getContext().startActivity(i);
                          });
                      }
                      @JavascriptInterface public boolean roomBg() { return room; }
            // 1.5: بيانات العضو للتبليغ «انسكّر التطبيق» (ما تنحفظ، بالذاكرة بس)
            @JavascriptInterface public void roomCreds(String r, String m, String a) { DalilRoomService.cRoom = r; DalilRoomService.cMember = m; DalilRoomService.cAuth = a; }
                  }, "DalilAndroid");
                  // 1.3: الصفحة ما تنخفض أولويتها وهي مخفية (غرفة الرحلة)
                  if (Build.VERSION.SDK_INT >= 26) wv.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                  h.postDelayed(poll, 4000);
              }

              // كل 3 ثواني: هل غرفة الرحلة شغالة؟ (بدون أي تعديل على كود الصفحة)
              private final Runnable poll = new Runnable() { @Override public void run() {
                  try {
                      getBridge().getWebView().evaluateJavascript("!!(window.DalilRoom&&window.DalilRoom.active)", v -> setRoom("true".equals(v)));
                  getBridge().getWebView().evaluateJavascript(AAC_JS, null);
                  if (room) getBridge().getWebView().evaluateJavascript(ROOM_SUB, null);
                  if (room && bg) keepVisible();   // نعيدها كل 3 ثواني (النظام ممكن يخفيها بعد onStop)
                  } catch (Exception e) { }
                  h.postDelayed(this, 3000);
              }};

              // 1.4: عضو الغرفة يسجّل رمز تنبيهاته (لو سكّر التطبيق نهائيًا يوصله «🎙️ فلان أرسل رسالة صوتية»)
              private static final String ROOM_SUB = "(function(){try{var s=JSON.parse(localStorage.getItem('dalil_room_v1')||'null'),t=localStorage.getItem('dalil_apns_token');if(!s||!s.room_id||!s.token||!s.member_id)return;try{DalilAndroid.roomCreds(s.room_id,s.member_id,s.token)}catch(e){}if(!t||/^[0-9a-f]+$/.test(t))return;var k=s.room_id+'|'+s.member_id+'|'+t.slice(-12);if(window.__dalRA===k&&Date.now()-(window.__dalRT||0)<600000)return;window.__dalRA=k;window.__dalRT=Date.now();var K='sb_publishable_WUbfRD9na71sHZ1rxFwImQ_JGzDOyXw';fetch('https://penhpgvjtxytgyrhmetg.supabase.co/rest/v1/rpc/room_android_sub',{method:'POST',headers:{'Content-Type':'application/json',apikey:K,authorization:'Bearer '+K},body:JSON.stringify({p_room:s.room_id,p_member:s.member_id,p_auth:s.token,p_token:t})}).catch(function(){window.__dalRA=''})}catch(e){}})()";
              // 1.6: تحويل رسائل الغرفة الصوتية لصيغة الآيفون (M4A/AAC) قبل الإرسال — ملف android/aac.js للأندرويد بس
              private static final String AAC_JS = "if(!window.__dalAac&&!window.__dalAacLoading&&document.head){window.__dalAacLoading=1;var s=document.createElement('script');s.src='https://f10f100a-debug.github.io/dalil-app/android/aac.js?v='+Math.floor(Date.now()/36e5);s.onerror=function(){window.__dalAacLoading=0};document.head.appendChild(s)}";

              private void setRoom(boolean on) {
                  if (on == room) return;
                  room = on;
                  Context c = getContext();
                  Intent i = new Intent(c, DalilRoomService.class);
                  try {
                      if (on) { if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i); }
                      else c.stopService(i);
                  } catch (Exception e) { room = false; }
                  if (on && bg) keepVisible();
              }

              // الغرفة شغالة والتطبيق طلع للخلفية: الصفحة تبقى «ظاهرة» عشان الصوت والمواقع ما يوقفون
              private void keepVisible() {
                  h.post(() -> {
                      try {
                          WebView wv = getBridge().getWebView();
                          wv.onResume(); wv.resumeTimers();
                          wv.dispatchWindowVisibilityChanged(View.VISIBLE);
                      } catch (Exception e) { }
                  });
              }

              @Override protected void handleOnPause() { super.handleOnPause(); bg = true; if (room) keepVisible(); }
              @Override protected void handleOnStop() { super.handleOnStop(); bg = true; if (room) keepVisible(); }
              @Override protected void handleOnResume() { super.handleOnResume(); bg = false; }
              @Override protected void handleOnDestroy() { if (room) DalilRoomService.reportClosed(); h.removeCallbacks(poll); try { getContext().stopService(new Intent(getContext(), DalilRoomService.class)); } catch (Exception e) { } super.handleOnDestroy(); }
          }
          JAVA
          sed -i 's/^          //' $J/DalilNative.java
          cat > $J/DalilRoomService.java <<'JAVA'
          package com.alluhaybi.dalil;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          // غرفة الرحلة في الخلفية: إشعار ثابت «غرفة الرحلة شغالة» يخلي الميكروفون والموقع يشتغلون والشاشة مقفلة
          public class DalilRoomService extends Service {
              private PowerManager.WakeLock wl;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm.getNotificationChannel("dalil_room") == null) {
                      NotificationChannel ch = new NotificationChannel("dalil_room", "غرفة الرحلة", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("يبقى ظاهر وأنت في غرفة الرحلة"); ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "dalil_room") : new Notification.Builder(this);
                  Notification n = b.setContentTitle("دليل: غرفة الرحلة شغالة")
                      .setContentText("الصوت والمواقع شغالة والشاشة مقفلة — لا تسكّر دليل من قائمة التطبيقات")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi).setOngoing(true).build();
                  int type = 0;
                  if (Build.VERSION.SDK_INT >= 29) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                      if (Build.VERSION.SDK_INT >= 30 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= 29 && type != 0) startForeground(7, n, type); else startForeground(7, n);
                  } catch (Exception e) {
                      try { startForeground(7, n); } catch (Exception e2) { stopSelf(); return START_NOT_STICKY; }
                  }
                  if (wl == null) {
                      wl = ((PowerManager) getSystemService(POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "dalil:room");
                      wl.setReferenceCounted(false);
                  }
                  wl.acquire(12 * 3600 * 1000L);   // أقصى رحلة 12 ساعة، وينفك أول ما تطلع من الغرفة
                  return START_NOT_STICKY;
              }

              // 1.5: سحبت التطبيق من قائمة التطبيقات وأنت بالغرفة → نبلّغ السيرفر فورًا عشان تنبيه الرسائل الصوتية يوصلك بدون انتظار
              static volatile String cRoom, cMember, cAuth;
              static void reportClosed() {
                  final String r = cRoom, m = cMember, a = cAuth;
                  if (r == null || m == null || a == null) return;
                  Thread t = new Thread(() -> {
            try {
                java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL("https://penhpgvjtxytgyrhmetg.supabase.co/rest/v1/rpc/room_android_closed").openConnection();
                c.setRequestMethod("POST"); c.setConnectTimeout(4000); c.setReadTimeout(4000); c.setDoOutput(true);
                String k = "sb_publishable_WUbfRD9na71sHZ1rxFwImQ_JGzDOyXw";
                c.setRequestProperty("Content-Type", "application/json"); c.setRequestProperty("apikey", k); c.setRequestProperty("Authorization", "Bearer " + k);
                org.json.JSONObject o = new org.json.JSONObject(); o.put("p_room", r); o.put("p_member", m); o.put("p_auth", a);
                c.getOutputStream().write(o.toString().getBytes("UTF-8"));
                c.getResponseCode(); c.disconnect();
            } catch (Exception e) { }
                  });
                  t.start();
                  try { t.join(3000); } catch (InterruptedException e) { }
              }
              @Override public void onTaskRemoved(Intent root) { reportClosed(); stopSelf(); super.onTaskRemoved(root); }

              @Override public void onDestroy() { if (wl != null && wl.isHeld()) wl.release(); super.onDestroy(); }
          }
          JAVA
          sed -i 's/^          //' $J/DalilRoomService.java
          # 1.3: خدمة غرفة الرحلة (ميكروفون + موقع) في AndroidManifest
          M=android/app/src/main/AndroidManifest.xml
          for p in FOREGROUND_SERVICE FOREGROUND_SERVICE_MICROPHONE FOREGROUND_SERVICE_LOCATION WAKE_LOCK; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<uses-permission android:name=\"android.permission.INTERNET\" />#&\n    <uses-permission android:name=\"android.permission.$p\" />#" $M
          done
          grep -q 'DalilRoomService' $M || sed -i 's#</application>#    <service android:name=".DalilRoomService" android:exported="false" android:foregroundServiceType="microphone|location" />\n    </application>#' $M
          grep -n 'DalilRoomService\|FOREGROUND\|WAKE_LOCK' $M
          cat > $J/MainActivity.java <<'JAVA'
          package com.alluhaybi.dalil;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DalilNative.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's/^          //' $J/MainActivity.java
          cat $J/MainActivity.java

      - name: تنبيهات أندرويد (1.2) — ملف فايربيس من السر GOOGLE_SERVICES_JSON
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GSJ" ]; then echo "::error::السر GOOGLE_SERVICES_JSON غير موجود (بدونه التنبيهات تطيّح التطبيق)"; exit 1; fi
          # نسخ النص من الجوال أحيانًا يضيّع القوس الأول/الأخير أو يقلب علامات التنصيص — نصلحه بدون طباعة المحتوى
          node -e '
            let t=process.env.GSJ.replace(/^\uFEFF/,"").replace(/[\u201C\u201D\u201E\u2033]/g,"\"").replace(/[\u2018\u2019]/g,"\x27").replace(/\u00A0/g," ").trim();
            const tries=[t,"{"+t+"}","{"+t,t+"}"];let j=null,k=-1;
            for(let i=0;i<tries.length&&!j;i++){try{j=JSON.parse(tries[i]);k=i}catch(e){}}
            if(!j||typeof j!=="object"){console.error("::error::السر GOOGLE_SERVICES_JSON مو JSON صحيح — انسخ الملف كامل من أول قوس { لآخر قوس }");process.exit(1)}
            if(k>0)console.log("::warning::السر كان ناقص قوس — انصلح تلقائيًا ("+k+")");
            require("fs").writeFileSync("android/app/google-services.json",JSON.stringify(j,null,2));'
          # تأكد إنه ملف فايربيس صحيح ولنفس التطبيق (بدون طباعة محتواه)
          node -e 'const j=require("./android/app/google-services.json");const ok=(j.client||[]).some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==="com.alluhaybi.dalil");if(!ok){console.error("package mismatch");process.exit(1)}console.log("firebase project:",j.project_info.project_id)'
          grep -n "google-services" android/build.gradle android/app/build.gradle

      - name: Target SDK 36 (شرط Google Play من 31 أغسطس 2026) + أقل إصدار أندرويد 7 (minSdk 24)
        run: |
          V=android/variables.gradle
          # minSdk 24: «الحماية التلقائية» في Google Play ترفض أي حزمة أقل من 24 (أندرويد 7)
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/; s/minSdkVersion = [0-9]*/minSdkVersion = 24/' $V
          grep -n "SdkVersion" $V

      - name: Upload key (release only)
        if: env.RELEASE == 'yes'
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -n "$KEY_PASS" ] || { echo "::error::أضف السر ANDROID_KEY_PASS في إعدادات GitHub أولًا"; exit 1; }
          K="$RUNNER_TEMP/key"; mkdir -p "$K"; cd "$K"
          # مفتاح الرفع محفوظ مشفّرًا في فرع android-key؛ يُنشأ مرة وحدة فقط
          if git clone -q --depth 1 -b android-key "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" repo 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY_PASS -in repo/upload.jks.enc -out upload.jks || { echo "::error::السر ANDROID_KEY_PASS لا يطابق المفتاح المحفوظ"; exit 1; }
            echo "::notice::upload key restored"
          else
            keytool -genkeypair -v -keystore upload.jks -alias dalil -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Dalil, O=Dalil, C=SA" >/dev/null 2>&1
            mkdir pub && cd pub && git init -q && git checkout -q -b android-key
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY_PASS -in ../upload.jks -out upload.jks.enc
            keytool -list -v -keystore ../upload.jks -storepass "$KEY_PASS" | grep -E "SHA1|SHA256" > fingerprints.txt
            echo "مفتاح الرفع لتطبيق دليل (مشفّر بكلمة ANDROID_KEY_PASS). Play App Signing يحمي التطبيق حتى لو ضاع." > README.txt
            git config user.email ci@dalil && git config user.name ci
            git add . && git commit -qm "Android upload key (encrypted)"
            git push -q "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" android-key
            cd .. && echo "::notice::new upload key created and saved (encrypted) to android-key"
          fi
          keytool -list -v -keystore upload.jks -storepass "$KEY_PASS" | grep -E "SHA256" | head -1
          echo "KS_FILE=$K/upload.jks" >> $GITHUB_ENV
          cat >> "$GITHUB_WORKSPACE/native/android/app/build.gradle" <<'GR'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KEY_PASS")
                      keyAlias "dalil"
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GR

      - name: Build AAB (release only)
        if: env.RELEASE == 'yes'
        working-directory: native/android
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease > "$RUNNER_TEMP/gradle-r.log" 2>&1 || { tail -60 "$RUNNER_TEMP/gradle-r.log"; echo "::error::$(grep -E 'error|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/gradle-r.log" | head -20 | paste -sd '|' -)"; exit 1; }
          ls -la app/build/outputs/bundle/release/
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dalil.aab"

      - name: Build APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/gradle.log" 2>&1 || { tail -60 "$RUNNER_TEMP/gradle.log"; echo "::error::$(grep -E 'error|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/gradle.log" | head -20 | paste -sd '|' -)"; exit 1; }
          tail -5 "$RUNNER_TEMP/gradle.log"
          ls -la app/build/outputs/apk/debug/

      - name: Publish APK to android-build branch
        working-directory: native/android/app/build/outputs/apk/debug
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp app-debug.apk "$RUNNER_TEMP/pub/dalil.apk"
          [ -f "$RUNNER_TEMP/dalil.aab" ] && cp "$RUNNER_TEMP/dalil.aab" "$RUNNER_TEMP/pub/dalil-$VERSION_NAME-$VERSION_CODE.aab"
          cd "$RUNNER_TEMP/pub"
          echo "دليل للأندرويد $VERSION_NAME (بناء $VERSION_CODE) — $(date -u +%F)" > README.txt
          git init -q && git checkout -q -b android-build
          git config user.email ci@dalil && git config user.name ci
          ls -la
          git add . && git commit -qm "Android APK $VERSION_NAME ($VERSION_CODE)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
          echo "::notice::APK: https://raw.githubusercontent.com/${{ github.repository }}/android-build/dalil.apk ($(du -h dalil.apk | cut -f1))"
          for f in *.aab; do [ -f "$f" ] && echo "::notice::AAB: https://raw.githubusercontent.com/${{ github.repository }}/android-build/$f ($(du -h "$f" | cut -f1))"; done; true
