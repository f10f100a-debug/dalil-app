# بناء تطبيق دليل للأندرويد (Capacitor) على GitHub.
# - التشغيل اليدوي: يبني ملف APK تجريبي ويضعه في فرع android-build ليُحمَّل ويُثبَّت مباشرة على أي جوال أندرويد.
# - التطبيق يفتح نفس صفحة دليل على الإنترنت (مثل تطبيق الآيفون)، فأي تحديث للموقع يصل للأندرويد فورًا.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار الظاهر للمستخدم"
        type: string
        default: "1.0"
      release:
        description: "بناء ملف AAB موقّع لمتجر Google Play (يحتاج السر ANDROID_KEY_PASS)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version || '1.0' }}
      VERSION_CODE: ${{ github.run_number }}
      RELEASE: ${{ inputs.release && 'yes' || 'no' }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor (Android)
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/android@^7

      - name: Generate Android project
        run: |
          run_logged () { "$@" > "$RUNNER_TEMP/step.log" 2>&1 || { cat "$RUNNER_TEMP/step.log"; echo "::error::$(tail -25 "$RUNNER_TEMP/step.log" | paste -sd '|' -)"; exit 1; }; cat "$RUNNER_TEMP/step.log"; }
          # هوية خاصة بالأندرويد (DalilAndroid) حتى تفرّق الصفحة بينه وبين تطبيق الآيفون
          node -e 'const f="capacitor.config.json",c=require("./"+f);c.appendUserAgent="DalilAndroid/"+process.env.VERSION_NAME;c.android={backgroundColor:"#F2EFE9",allowMixedContent:false,adjustMarginsForEdgeToEdge:"force"};require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
          run_logged npx cap add android
          run_logged npx cap sync android

      - name: Name, icon, splash, permissions, version
        run: |
          set -e
          R=android/app/src/main/res
          # الاسم
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">دليل</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">دليل</string>#' $R/values/strings.xml
          # الأيقونة وشاشة البداية (sharp لأن ImageMagick غير متوفر على أجهزة GitHub الجديدة)
          rm -rf $R/mipmap-anydpi-v26
          npm install --no-audit --no-fund --no-save sharp@0.33 >/dev/null
          R=$R node -e '
            const sharp=require("sharp"),fs=require("fs"),path=require("path"),R=process.env.R;
            (async()=>{
              for(const [n,s] of [["mdpi",48],["hdpi",72],["xhdpi",96],["xxhdpi",144],["xxxhdpi",192]]){
                for(const f of ["ic_launcher","ic_launcher_round"]) await sharp("resources/icon-1024.png").resize(s,s).png().toFile(path.join(R,"mipmap-"+n,f+".png"));
                fs.rmSync(path.join(R,"mipmap-"+n,"ic_launcher_foreground.png"),{force:true});
              }
              const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
              for(const f of walk(R).filter(f=>path.basename(f)==="splash.png")){
                const m=await sharp(f).metadata();
                const buf=await sharp("resources/splash-2732x2732.png").resize(m.width,m.height,{fit:"cover"}).png().toBuffer();
                fs.writeFileSync(f,buf);
              }
              console.log("icons + splash ok");
            })().catch(e=>{console.error(e);process.exit(1)});'
          # الأذونات: الموقع (البوصلة والتوجيه)، الميكروفون (غرفة الرحلة)، الكاميرا (صورة/فيديو حدث)، الاهتزاز
          M=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA VIBRATE; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<uses-permission android:name=\"android.permission.INTERNET\" />#&\n    <uses-permission android:name=\"android.permission.$p\" />#" $M
          done
          grep -q 'android.hardware.location.gps' $M || sed -i 's#</manifest>#    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          # رقم الإصدار
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" $G
          grep -n "applicationId\|versionCode\|versionName" $G
          grep -n "uses-permission\|uses-feature" $M
          echo "::notice::Android $VERSION_NAME ($VERSION_CODE) — UserAgent DalilAndroid/$VERSION_NAME"

      - name: Target SDK 36 (شرط Google Play من 31 أغسطس 2026) + أقل إصدار أندرويد 7 (minSdk 24)
        run: |
          V=android/variables.gradle
          # minSdk 24: «الحماية التلقائية» في Google Play ترفض أي حزمة أقل من 24 (أندرويد 7)
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/; s/minSdkVersion = [0-9]*/minSdkVersion = 24/' $V
          grep -n "SdkVersion" $V

      - name: Upload key (release only)
        if: env.RELEASE == 'yes'
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          [ -n "$KEY_PASS" ] || { echo "::error::أضف السر ANDROID_KEY_PASS في إعدادات GitHub أولًا"; exit 1; }
          K="$RUNNER_TEMP/key"; mkdir -p "$K"; cd "$K"
          # مفتاح الرفع محفوظ مشفّرًا في فرع android-key؛ يُنشأ مرة وحدة فقط
          if git clone -q --depth 1 -b android-key "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" repo 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY_PASS -in repo/upload.jks.enc -out upload.jks || { echo "::error::السر ANDROID_KEY_PASS لا يطابق المفتاح المحفوظ"; exit 1; }
            echo "::notice::upload key restored"
          else
            keytool -genkeypair -v -keystore upload.jks -alias dalil -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Dalil, O=Dalil, C=SA" >/dev/null 2>&1
            mkdir pub && cd pub && git init -q && git checkout -q -b android-key
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY_PASS -in ../upload.jks -out upload.jks.enc
            keytool -list -v -keystore ../upload.jks -storepass "$KEY_PASS" | grep -E "SHA1|SHA256" > fingerprints.txt
            echo "مفتاح الرفع لتطبيق دليل (مشفّر بكلمة ANDROID_KEY_PASS). Play App Signing يحمي التطبيق حتى لو ضاع." > README.txt
            git config user.email ci@dalil && git config user.name ci
            git add . && git commit -qm "Android upload key (encrypted)"
            git push -q "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" android-key
            cd .. && echo "::notice::new upload key created and saved (encrypted) to android-key"
          fi
          keytool -list -v -keystore upload.jks -storepass "$KEY_PASS" | grep -E "SHA256" | head -1
          echo "KS_FILE=$K/upload.jks" >> $GITHUB_ENV
          cat >> "$GITHUB_WORKSPACE/native/android/app/build.gradle" <<'GR'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KEY_PASS")
                      keyAlias "dalil"
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GR

      - name: Build AAB (release only)
        if: env.RELEASE == 'yes'
        working-directory: native/android
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease > "$RUNNER_TEMP/gradle-r.log" 2>&1 || { tail -60 "$RUNNER_TEMP/gradle-r.log"; echo "::error::$(grep -E 'error|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/gradle-r.log" | head -20 | paste -sd '|' -)"; exit 1; }
          ls -la app/build/outputs/bundle/release/
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dalil.aab"

      - name: Build APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/gradle.log" 2>&1 || { tail -60 "$RUNNER_TEMP/gradle.log"; echo "::error::$(grep -E 'error|FAILURE|What went wrong' -A3 "$RUNNER_TEMP/gradle.log" | head -20 | paste -sd '|' -)"; exit 1; }
          tail -5 "$RUNNER_TEMP/gradle.log"
          ls -la app/build/outputs/apk/debug/

      - name: Publish APK to android-build branch
        working-directory: native/android/app/build/outputs/apk/debug
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp app-debug.apk "$RUNNER_TEMP/pub/dalil.apk"
          [ -f "$RUNNER_TEMP/dalil.aab" ] && cp "$RUNNER_TEMP/dalil.aab" "$RUNNER_TEMP/pub/dalil-$VERSION_NAME-$VERSION_CODE.aab"
          cd "$RUNNER_TEMP/pub"
          echo "دليل للأندرويد $VERSION_NAME (بناء $VERSION_CODE) — $(date -u +%F)" > README.txt
          git init -q && git checkout -q -b android-build
          git config user.email ci@dalil && git config user.name ci
          ls -la
          git add . && git commit -qm "Android APK $VERSION_NAME ($VERSION_CODE)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
          echo "::notice::APK: https://raw.githubusercontent.com/${{ github.repository }}/android-build/dalil.apk ($(du -h dalil.apk | cut -f1))"
          for f in *.aab; do [ -f "$f" ] && echo "::notice::AAB: https://raw.githubusercontent.com/${{ github.repository }}/android-build/$f ($(du -h "$f" | cut -f1))"; done; true
