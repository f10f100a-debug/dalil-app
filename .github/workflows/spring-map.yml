# تجربة طبقة الربيع الدقيقة: فرق خضرة كل بكسل 10 م عن الصيف → صور + إحصاءات
name: Spring map test
on:
  workflow_dispatch:
    inputs:
      boxes: { description: "اسم:جنوب:غرب:شمال:شرق;...", type: string, default: "" }
      pts: { description: "lat:lng:اسم,...", type: string, default: "" }
      mode: { description: "raw = آخر صورة بألوان NDVI", type: string, default: "" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet rasterio numpy pillow
      - env: { SPRING_BOXES: "${{ inputs.boxes }}", SPRING_PTS: "${{ inputs.pts }}", SPRING_MODE: "${{ inputs.mode }}" }
        run: python3 tools/fayd/springmap.py
      - name: push images to diag-out branch
        run: |
          cd diag && git init -q && git checkout -q -b diag-out && git add . && git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
