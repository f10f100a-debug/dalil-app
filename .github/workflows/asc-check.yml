# فحص للقراءة فقط لصفحة التطبيق في App Store Connect قبل الإرسال للمراجعة.
name: App Store check
on:
  workflow_dispatch:
    inputs:
      fix_order:
        description: "رتّب صور الشاشة حسب اسم الملف (01..06)"
        type: boolean
        default: false
      set_build:
        description: "رقم البناء لربطه بالنسخة (اختياري)"
        type: string
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/asc }
      - run: pip install --quiet pyjwt cryptography
      - name: Read App Store Connect (read-only)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.ASC_KEY_P8_BASE64 }}
          FIX_ORDER: ${{ inputs.fix_order }}
          SET_BUILD: ${{ inputs.set_build }}
        run: python3 tools/asc/check.py
