# 19 نوفمبر: اختبار دقة مطر الفقع — CHIRPS (أقمار) مقابل رقمنا والمحطات (يدوي، ما يغيّر التطبيق)
name: FQ check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q rasterio numpy
      - run: python3 tools/fayd/fqcheck.py
      - run: |
          git config user.email ci@dalil && git config user.name "dalil-bot"
          git add data/fq-check.json && git commit -qm "اختبار دقة مطر الفقع (CHIRPS)" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || true
