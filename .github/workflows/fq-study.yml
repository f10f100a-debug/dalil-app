# دراسة توقع الفقع (أمطار الوسم التاريخية) — يدوي، والنتيجة في فرع fq-study
name: FQ study
on: workflow_dispatch
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/fq }
      - run: python3 tools/fq/study.py
      - name: Publish
        run: |
          mkdir pub && cp fq_study.json pub/ && cd pub && git init -q && git checkout -q -b fq-study
          git config user.email ci@dalil && git config user.name ci
          git add . && git commit -qm "fq study" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fq-study
          echo "::notice::fq study published"
