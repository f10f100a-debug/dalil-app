# بناء تطبيق دليل للآيفون على أجهزة Mac سحابية من GitHub، ورفعه إلى TestFlight.
# - كل دفع (push) يغيّر مجلد native/ أو هذا الملف: بناء تجريبي بدون توقيع للتأكد أن المشروع سليم.
# - التشغيل اليدوي (Actions → iOS → Run workflow) مع خيار "upload": بناء موقّع ورفعه إلى App Store Connect.
#   يحتاج أسرار المستودع: APPLE_TEAM_ID و ASC_KEY_ID و ASC_ISSUER_ID و ASC_KEY_P8 (نص ملف .p8 كما هو).
name: iOS

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "ارفع النسخة إلى TestFlight"
        type: boolean
        default: true
      version:
        description: "رقم الإصدار الظاهر للمستخدم"
        type: string
        default: "1.0"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MARKETING_VERSION: ${{ inputs.version || '1.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
      DO_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            .github
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        run: |
          # أبل تشترط البناء بأحدث SDK، فنختار أحدث Xcode مستقر على الجهاز السحابي
          ls -d /Applications/Xcode_*.app
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "::notice::$(xcodebuild -version | paste -sd ' ' -) — iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: |
          # نعرض آخر سطور الخطأ كتنبيه حتى يُقرأ من صفحة التشغيل
          run_logged () { "$@" > "$RUNNER_TEMP/step.log" 2>&1 || { cat "$RUNNER_TEMP/step.log"; echo "::error::$(tail -25 "$RUNNER_TEMP/step.log" | paste -sd '|' -)"; exit 1; }; cat "$RUNNER_TEMP/step.log"; }
          run_logged npx cap --version
          # رقم الإصدار في هوية المتصفح: الويب يفتح ميزات الإصدار الجديد (مثل غرفة الرحلة) حسبه
          node -e 'const f="capacitor.config.json",c=require("./"+f);c.appendUserAgent="DalilApp/"+process.env.MARKETING_VERSION;require("fs").writeFileSync(f,JSON.stringify(c,null,2))'
          echo "::notice::UserAgent DalilApp/$MARKETING_VERSION"
          run_logged npx cap add ios
          run_logged npx cap sync ios

      - name: Icon, splash and Info.plist
        run: |
          set -e
          XC=ios/App/App/Assets.xcassets
          # الأيقونة (1024 بلا شفافية) تحل محل أيقونة Capacitor الافتراضية
          ICONSET="$XC/AppIcon.appiconset"
          for f in "$ICONSET"/*.png; do cp resources/icon-1024.png "$f"; done
          # شاشة البداية بلون دليل
          for f in "$XC"/Splash.imageset/*.png; do cp resources/splash-2732x2732.png "$f"; done

          P=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          set_str () { $PB -c "Delete :$1" "$P" 2>/dev/null || true; $PB -c "Add :$1 string $2" "$P"; }
          set_str CFBundleDisplayName "دليل"
          set_str CFBundleDevelopmentRegion "ar"
          set_str NSLocationWhenInUseUsageDescription "يستخدم دليل موقعك لعرضه على الخريطة وتشغيل البوصلة والتوجيه وتسجيل مسارك. لا يُشارَك إلا مع أعضاء غرفة رحلة تدخلها بنفسك."
          set_str NSMotionUsageDescription "يستخدم دليل مستشعرات الحركة لتشغيل البوصلة وتحديد اتجاهك."
          set_str NSCameraUsageDescription "لالتقاط صورة حدث (سيل أو مطر) ونشرها لمستخدمي منطقتك إن اخترت ذلك."
          set_str NSMicrophoneUsageDescription "لإرسال رسائل صوتية لأعضاء غرفة الرحلة عند الضغط على «اضغط وتكلّم» فقط."
          set_str NSPhotoLibraryUsageDescription "لاختيار صورة حدث من ألبومك أو استيراد ملفات خرائطك."
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          # النطاق الوحيد الذي يعمل داخله التطبيق (يسمح بعمل Service Worker والخرائط بدون إنترنت)
          $PB -c "Delete :WKAppBoundDomains" "$P" 2>/dev/null || true
          $PB -c "Add :WKAppBoundDomains array" "$P"
          $PB -c "Add :WKAppBoundDomains:0 string f10f100a-debug.github.io" "$P"
          # 1.3: موقع في الخلفية أثناء تسجيل مسار أو داخل غرفة رحلة (بإذن «أثناء الاستخدام» مع المؤشر الأزرق)
          $PB -c "Print :UIBackgroundModes" "$P" >/dev/null 2>&1 || $PB -c "Add :UIBackgroundModes array" "$P"
          $PB -c "Print :UIBackgroundModes" "$P" | grep -q location || $PB -c "Add :UIBackgroundModes: string location" "$P"
          # 1.3: روابط dalil:// لفتح دعوة غرفة الرحلة داخل التطبيق
          $PB -c "Delete :CFBundleURLTypes" "$P" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$P"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$P"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.alluhaybi.dalil" "$P"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$P"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string dalil" "$P"
          plutil -lint "$P"
          # التنبيهات الأصلية (APNs): صلاحية التطبيق + تمرير رمز الجهاز إلى Capacitor
          cat > ios/App/App/App.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          XML
          sed -i '' -e 's/^          //' ios/App/App/App.entitlements
          plutil -lint ios/App/App/App.entitlements
          # 1.4: الروابط العامة (Universal Links) — رابط الدعوة يفتح التطبيق مباشرة
          case "$MARKETING_VERSION" in 1.0|1.1|1.2|1.3) echo "::notice::Associated domains: skipped for $MARKETING_VERSION";; *)
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains array" ios/App/App/App.entitlements
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.associated-domains:0 string applinks:f10f100a-debug.github.io" ios/App/App/App.entitlements
            plutil -lint ios/App/App/App.entitlements
            echo "::notice::Associated domains: applinks:f10f100a-debug.github.io"
            # 1.4: اللاسلكي (Apple PushToTalk) — الصوت يشتغل والجوال مقفل
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.push-to-talk bool true" ios/App/App/App.entitlements
            $PB -c "Print :UIBackgroundModes" "$P" | grep -q push-to-talk || $PB -c "Add :UIBackgroundModes: string push-to-talk" "$P"
            plutil -lint ios/App/App/App.entitlements; plutil -lint "$P"
            echo "::notice::Push to Talk: entitlement + background mode";;
          esac
          python3 - <<'PY'
          p = "ios/App/App/AppDelegate.swift"
          s = open(p).read()
          if "didRegisterForRemoteNotificationsWithDeviceToken" not in s:
              add = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
              i = s.rstrip().rfind("}")
              s = s[:i] + add + "}\n"
              open(p, "w").write(s)
          print("::notice::AppDelegate push hooks: " + ("OK" if "capacitorDidRegisterForRemoteNotifications" in open(p).read() else "MISSING"))
          # بوصلة أصلية: تقرأ اتجاه الجوال من النظام (بلا إذن «الحركة» ولا ضغطة) وترسله للصفحة
          s = open(p).read()
          if "DalilHeading" not in s:
              s = s.replace("import UIKit", "import UIKit\nimport CoreLocation\nimport WebKit", 1)
              i = s.find("didFinishLaunchingWithOptions")
              j = s.find("return true", i)
              s = s[:j] + "DalilHeading.shared.start()\n        " + s[j:]
              s = s.rstrip() + """

          final class DalilHeading: NSObject, CLLocationManagerDelegate {
              static let shared = DalilHeading()
              private let lm = CLLocationManager()
              private weak var web: WKWebView?
              private var lastJS: String?
              private var timer: Timer?
              func start() {
                  guard CLLocationManager.headingAvailable() else { return }
                  lm.delegate = self
                  lm.headingFilter = 1
                  lm.headingOrientation = .portrait
                  lm.startUpdatingHeading()
                  // الجوال الثابت لا يرسل قراءات جديدة: نعيد آخر اتجاه كل ثانية حتى لا تظن الصفحة أن البوصلة توقفت
                  timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in self?.send() }
                  NotificationCenter.default.addObserver(self, selector: #selector(resume), name: UIApplication.didBecomeActiveNotification, object: nil)
                  NotificationCenter.default.addObserver(self, selector: #selector(pause), name: UIApplication.didEnterBackgroundNotification, object: nil)
              }
              @objc private func resume() { lm.startUpdatingHeading() }
              @objc private func pause() { lm.stopUpdatingHeading() }
              func locationManager(_ manager: CLLocationManager, didUpdateHeading h: CLHeading) {
                  let v = h.trueHeading >= 0 ? h.trueHeading : h.magneticHeading
                  guard v >= 0, h.headingAccuracy >= 0 else { return }
                  let js = String(format: "window.__dalilNativeHeading&&window.__dalilNativeHeading(%.1f,%.0f)", v, h.headingAccuracy)
                  lastJS = js
                  send()
              }
              private func send() {
                  guard UIApplication.shared.applicationState == .active, let js = lastJS else { return }
                  webView()?.evaluateJavaScript(js, completionHandler: nil)
              }
              func locationManagerShouldDisplayHeadingCalibration(_ manager: CLLocationManager) -> Bool { false }
              private func webView() -> WKWebView? {
                  if let w = web { return w }
                  let root = (UIApplication.shared.delegate as? AppDelegate)?.window?.rootViewController
                  web = find(root?.view)
                  return web
              }
              private func find(_ v: UIView?) -> WKWebView? {
                  guard let v = v else { return nil }
                  if let w = v as? WKWebView { return w }
                  for s in v.subviews { if let w = find(s) { return w } }
                  return nil
              }
          }
          """
              open(p, "w").write(s)
          # 1.3: موقع في الخلفية (مسار + غرفة الرحلة) وروابط dalil://
          s = open(p).read()
          if "DalilBg" not in s:
              i = s.find("didFinishLaunchingWithOptions")
              j = s.find("return true", i)
              s = s[:j] + "DalilBg.shared.start()\n        " + s[j:]
              s = s.replace("return ApplicationDelegateProxy.shared.application(app, open: url, options: options)",
                            "DalilBg.shared.openURL(url)\n        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)", 1)
              s = s.replace("return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)",
                            "if let u = userActivity.webpageURL { DalilBg.shared.openURL(u) }\n        return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)", 1)
              s = s.rstrip() + """

          final class DalilBg: NSObject, CLLocationManagerDelegate, WKScriptMessageHandler {
              static let shared = DalilBg()
              private let lm = CLLocationManager()
              private weak var web: WKWebView?
              private var attached = false
              private var track = false
              private var room: [String: Any]? = nil
              private var buffer: [[String: Double]] = []
              private var lastSent = Date.distantPast
              private var lastSentLoc: CLLocation?
              private var pendingURL: String?
              private var timer: Timer?
              func start() {
                  lm.delegate = self
                  lm.desiredAccuracy = kCLLocationAccuracyBest
                  lm.distanceFilter = 5
                  lm.activityType = .otherNavigation
                  lm.pausesLocationUpdatesAutomatically = false
                  timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in self?.tick() }
              }
              func openURL(_ url: URL) { pendingURL = url.absoluteString }
              private func tick() {
                  guard let w = webView() else { return }
                  if !attached { attached = true; w.configuration.userContentController.add(self, name: "dalil") }
                  if let u = pendingURL, UIApplication.shared.applicationState == .active,
                     let d = try? JSONSerialization.data(withJSONObject: [u]), var js = String(data: d, encoding: .utf8) {
                      js = String(js.dropFirst().dropLast())
                      w.evaluateJavaScript("window.__dalilOpenUrl ? window.__dalilOpenUrl(" + js + ") : false") { r, _ in
                          if (r as? Bool) == true { self.pendingURL = nil }
                      }
                  }
              }
              func userContentController(_ c: WKUserContentController, didReceive m: WKScriptMessage) {
                  guard let b = m.body as? [String: Any], let cmd = b["cmd"] as? String else { return }
                  if cmd == "bg" {
                      track = (b["track"] as? Bool) ?? false
                      room = b["room"] as? [String: Any]
                      if #available(iOS 16.0, *) { DalilPTT.shared.sync(room) }
                      if !track { buffer.removeAll() }
                      if track || room != nil {
                          lm.allowsBackgroundLocationUpdates = true
                          lm.showsBackgroundLocationIndicator = true
                          lm.startUpdatingLocation()
                      } else {
                          lm.stopUpdatingLocation()
                          lm.allowsBackgroundLocationUpdates = false
                      }
                  } else if cmd == "drain" {
                      let pts = buffer; buffer.removeAll()
                      if let d = try? JSONSerialization.data(withJSONObject: pts), let s = String(data: d, encoding: .utf8) {
                          m.webView?.evaluateJavaScript("window.__dalilBgDrain && window.__dalilBgDrain(" + s + ")", completionHandler: nil)
                      }
                  }
              }
              func locationManager(_ manager: CLLocationManager, didUpdateLocations locs: [CLLocation]) {
                  if UIApplication.shared.applicationState == .active { return }   // في المقدمة: الصفحة تتولى الموقع
                  if track {
                      for l in locs where l.horizontalAccuracy >= 0 && l.horizontalAccuracy <= 60 {
                          buffer.append(["lat": l.coordinate.latitude, "lng": l.coordinate.longitude, "t": l.timestamp.timeIntervalSince1970 * 1000, "acc": l.horizontalAccuracy])
                      }
                      if buffer.count > 20000 { buffer.removeFirst(buffer.count - 20000) }
                  }
                  if let r = room, let l = locs.last, l.horizontalAccuracy >= 0 {
                      let since = Date().timeIntervalSince(lastSent)
                      let moved = lastSentLoc.map { l.distance(from: $0) } ?? 1e9
                      if since > 25 && (moved > 15 || since > 90) { send(r, l) }
                  }
              }
              private func send(_ r: [String: Any], _ l: CLLocation) {
                  guard let us = r["url"] as? String, let url = URL(string: us), let key = r["key"] as? String else { return }
                  lastSent = Date(); lastSentLoc = l
                  var req = URLRequest(url: url); req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "content-type")
                  req.setValue(key, forHTTPHeaderField: "apikey")
                  var body = r; body.removeValue(forKey: "url"); body.removeValue(forKey: "key")
                  body["lat"] = l.coordinate.latitude; body["lng"] = l.coordinate.longitude
                  body["acc"] = l.horizontalAccuracy; body["spd"] = max(0, l.speed)
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  var task: UIBackgroundTaskIdentifier = .invalid
                  task = UIApplication.shared.beginBackgroundTask { UIApplication.shared.endBackgroundTask(task) }
                  URLSession.shared.dataTask(with: req) { _, _, _ in UIApplication.shared.endBackgroundTask(task) }.resume()
              }
              private func webView() -> WKWebView? {
                  if let w = web { return w }
                  let root = (UIApplication.shared.delegate as? AppDelegate)?.window?.rootViewController
                  web = find(root?.view)
                  return web
              }
              private func find(_ v: UIView?) -> WKWebView? {
                  guard let v = v else { return nil }
                  if let w = v as? WKWebView { return w }
                  for s in v.subviews { if let w = find(s) { return w } }
                  return nil
              }
          }
          """
              open(p, "w").write(s)
          # 1.4: اللاسلكي في الخلفية (Apple PushToTalk) — يُفعَّل فقط مع صلاحيته (1.4+)، ويعمل من iOS 16
          s = open(p).read()
          if "class DalilPTT" not in s:
              s = s.replace("import UIKit", "import UIKit\nimport AVFoundation\nimport PushToTalk", 1)
              i = s.find("didFinishLaunchingWithOptions")
              j = s.find("return true", i)
              s = s[:j] + "if #available(iOS 16.0, *) { DalilPTT.shared.setup() }\n        " + s[j:]
              s = s.rstrip() + """
          @available(iOS 16.0, *)
          final class DalilPTT: NSObject, PTChannelManagerDelegate, PTChannelRestorationDelegate, AVAudioPlayerDelegate {
              static let shared = DalilPTT()
              private var mgr: PTChannelManager?
              private var room: [String: Any]? = UserDefaults.standard.dictionary(forKey: "dalil_ptt_room")
              private var joined: UUID?
              private var joining = false
              private var active = true
              private var queue: [URL] = []
              private var player: AVAudioPlayer?
              private var recorder: AVAudioRecorder?
              private var recStart = Date()
              private var transmitting = false
              private var token = ""
              func setup() {
                  NotificationCenter.default.addObserver(forName: UIApplication.didBecomeActiveNotification, object: nil, queue: .main) { [weak self] _ in self?.active = true; self?.reconcile() }
                  NotificationCenter.default.addObserver(forName: UIApplication.willResignActiveNotification, object: nil, queue: .main) { [weak self] _ in self?.active = false }
                  Task { @MainActor in
                      do { self.mgr = try await PTChannelManager.channelManager(delegate: self, restorationDelegate: self) } catch { NSLog("dalil ptt manager: \\(error)") }
                      self.joined = self.mgr?.activeChannelUUID
                      self.reconcile()
                  }
              }
              func sync(_ r: [String: Any]?) {
                  room = r
                  if let r = r { UserDefaults.standard.set(r, forKey: "dalil_ptt_room") } else { UserDefaults.standard.removeObject(forKey: "dalil_ptt_room") }
                  DispatchQueue.main.async { self.reconcile() }
              }
              private func want() -> UUID? { (room?["room_id"] as? String).flatMap { UUID(uuidString: $0) } }
              private func reconcile() {
                  guard let m = mgr else { return }
                  let w = want(), cur = m.activeChannelUUID ?? joined
                  if let c = cur, c != w { m.leaveChannel(channelUUID: c); joined = nil }
                  if let w = w, (m.activeChannelUUID ?? joined) != w, active, !joining {
                      joining = true
                      let n = (room?["name"] as? String) ?? ""
                      m.requestJoinChannel(channelUUID: w, descriptor: PTChannelDescriptor(name: n.isEmpty ? "غرفة الرحلة — دليل" : n, image: nil))
                  }
              }
              func channelDescriptor(restoredChannelUUID channelUUID: UUID) -> PTChannelDescriptor {
                  let n = (room?["name"] as? String) ?? ""
                  return PTChannelDescriptor(name: n.isEmpty ? "غرفة الرحلة — دليل" : n, image: nil)
              }
              func channelManager(_ channelManager: PTChannelManager, didJoinChannel channelUUID: UUID, reason: PTChannelJoinReason) {
                  joined = channelUUID; joining = false
                  if !token.isEmpty { post("ptt", ["ptt_token": token]) }
              }
              func channelManager(_ channelManager: PTChannelManager, failedToJoinChannel channelUUID: UUID, error: Error) { joining = false; NSLog("dalil ptt join: \\(error)") }
              func channelManager(_ channelManager: PTChannelManager, didLeaveChannel channelUUID: UUID, reason: PTChannelLeaveReason) {
                  if joined == channelUUID { joined = nil }
                  if want() == channelUUID { post("ptt", ["ptt_token": ""]) }   // خرج من زر النظام: يرجع للإشعارات العادية
              }
              func channelManager(_ channelManager: PTChannelManager, receivedEphemeralPushToken pushToken: Data) {
                  token = pushToken.map { String(format: "%02x", $0) }.joined()
                  post("ptt", ["ptt_token": token])
              }
              // صوت وصل والجوال مقفل: النظام يصحّي التطبيق ويفعّل الصوت، ونحن نشغّل الرسالة
              func incomingPushResult(channelManager: PTChannelManager, channelUUID: UUID, pushPayload: [String: Any]) -> PTPushResult {
                  if (pushPayload["leave"] as? Bool) == true { return .leaveChannel }
                  let who = (pushPayload["activeSpeaker"] as? String) ?? "عضو في الغرفة"
                  if !active, let s = pushPayload["url"] as? String, let u = URL(string: s) {
                      DispatchQueue.main.async { self.queue.append(u); if self.player != nil { return } }
                  } else {
                      // التطبيق مفتوح: الصفحة تشغّل الصوت بنفسها
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) { channelManager.setActiveRemoteParticipant(nil, channelUUID: channelUUID, completionHandler: nil) }
                  }
                  return .activeRemoteParticipant(PTParticipant(name: who, image: nil))
              }
              func channelManager(_ channelManager: PTChannelManager, didActivate audioSession: AVAudioSession) {
                  try? audioSession.setCategory(.playAndRecord, mode: .default, options: [.defaultToSpeaker, .allowBluetooth])
                  DispatchQueue.main.async { if self.transmitting { self.startRec() } else { self.playNext() } }
              }
              func channelManager(_ channelManager: PTChannelManager, didDeactivate audioSession: AVAudioSession) {}
              private func playNext() {
                  guard player == nil else { return }
                  guard !queue.isEmpty else { finish(); return }
                  let u = queue.removeFirst()
                  URLSession.shared.dataTask(with: u) { d, _, _ in
                      DispatchQueue.main.async {
                          guard let d = d, let p = try? AVAudioPlayer(data: d) else { self.playNext(); return }
                          self.player = p; p.delegate = self; p.prepareToPlay()
                          if !p.play() { self.player = nil; self.playNext() }
                      }
                  }.resume()
              }
              func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) { DispatchQueue.main.async { self.player = nil; self.playNext() } }
              private func finish() { if let m = mgr, let c = joined { m.setActiveRemoteParticipant(nil, channelUUID: c, completionHandler: nil) } }
              // الكلام من زر اللاسلكي في شاشة القفل
              func channelManager(_ channelManager: PTChannelManager, channelUUID: UUID, didBeginTransmittingFrom source: PTChannelTransmitRequestSource) { DispatchQueue.main.async { self.transmitting = true } }
              func channelManager(_ channelManager: PTChannelManager, channelUUID: UUID, didEndTransmittingFrom source: PTChannelTransmitRequestSource) { DispatchQueue.main.async { self.transmitting = false; self.stopRec() } }
              private func startRec() {
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent("ptt-" + UUID().uuidString + ".m4a")
                  let set: [String: Any] = [AVFormatIDKey: kAudioFormatMPEG4AAC, AVSampleRateKey: 22050, AVNumberOfChannelsKey: 1, AVEncoderBitRateKey: 24000]
                  recorder = try? AVAudioRecorder(url: url, settings: set)
                  recStart = Date(); recorder?.record()
              }
              private func stopRec() {
                  guard let r = recorder else { return }
                  r.stop(); recorder = nil
                  let dur = Date().timeIntervalSince(recStart)
                  defer { try? FileManager.default.removeItem(at: r.url) }
                  guard dur > 0.6, let data = try? Data(contentsOf: r.url), data.count > 200 else { return }
                  upload(data, dur)
              }
              private func endpoint(_ action: String) -> (URL, String, [String: Any])? {
                  guard let r = room, let base = r["url"] as? String, let key = r["key"] as? String,
                        let url = URL(string: base.replacingOccurrences(of: "a=bgpos", with: "a=" + action)) else { return nil }
                  var auth: [String: Any] = [:]
                  for k in ["room_id", "member_id", "token"] { auth[k] = r[k] }
                  return (url, key, auth)
              }
              private func send(_ req: URLRequest) {
                  var task: UIBackgroundTaskIdentifier = .invalid
                  task = UIApplication.shared.beginBackgroundTask { UIApplication.shared.endBackgroundTask(task) }
                  URLSession.shared.dataTask(with: req) { _, _, _ in UIApplication.shared.endBackgroundTask(task) }.resume()
              }
              private func post(_ action: String, _ extra: [String: Any]) {
                  guard let ep = endpoint(action) else { return }
                  let (url, key, auth) = ep
                  var body = auth; for (k, v) in extra { body[k] = v }
                  var req = URLRequest(url: url); req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "content-type"); req.setValue(key, forHTTPHeaderField: "apikey")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  send(req)
              }
              private func upload(_ data: Data, _ dur: Double) {
                  guard let ep = endpoint("voice") else { return }
                  let (url, key, auth) = ep
                  let b = "dalil-" + UUID().uuidString
                  var body = Data()
                  func field(_ n: String, _ v: String) { body.append(("--" + b + "\\r\\nContent-Disposition: form-data; name=\\"" + n + "\\"\\r\\n\\r\\n" + v + "\\r\\n").data(using: .utf8)!) }
                  for (k, v) in auth { field(k, (v as? String) ?? "") }
                  field("id", UUID().uuidString.lowercased()); field("duration", String(format: "%.1f", dur)); field("native", "1")
                  body.append(("--" + b + "\\r\\nContent-Disposition: form-data; name=\\"audio\\"; filename=\\"voice.m4a\\"\\r\\nContent-Type: audio/mp4\\r\\n\\r\\n").data(using: .utf8)!)
                  body.append(data); body.append(("\\r\\n--" + b + "--\\r\\n").data(using: .utf8)!)
                  var req = URLRequest(url: url); req.httpMethod = "POST"
                  req.setValue("multipart/form-data; boundary=" + b, forHTTPHeaderField: "content-type"); req.setValue(key, forHTTPHeaderField: "apikey")
                  req.httpBody = body
                  send(req)
              }
          }
          """
              open(p, "w").write(s)
          print("::notice::Push to Talk class: " + ("OK" if "DalilPTT.shared.setup()" in open(p).read() else "MISSING"))
          print("::notice::Native heading: " + ("OK" if "DalilHeading.shared.start()" in open(p).read() else "MISSING"))
          print("::notice::Universal links hook: " + ("OK" if "userActivity.webpageURL" in open(p).read() else "MISSING"))
          print("::notice::Background location + links: " + ("OK" if "DalilBg.shared.openURL(url)" in open(p).read() and "DalilBg.shared.start()" in open(p).read() else "MISSING"))
          PY

      - name: Build check (unsigned)
        if: env.DO_UPLOAD != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" OTHER_LDFLAGS='$(inherited) -weak_framework PushToTalk' \
            TARGETED_DEVICE_FAMILY=1 CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:|warning: .*fail" "$RUNNER_TEMP/build.log" | head -20; echo "::error::$(grep -E 'error:' "$RUNNER_TEMP/build.log" | head -12 | paste -sd '|' -)"; tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/build.log"

      - name: Verify App Store Connect key
        if: env.DO_UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # فحص المفتاح قبل البناء: يطبع الشكل فقط (بدون القيم السرية) ونتيجة الاتصال بأبل
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography >/dev/null 2>&1 || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, re, time, base64, json, urllib.request, urllib.error, jwt
          kid=os.environ["KEY_ID"].strip(); iss=os.environ["ISSUER_ID"].strip(); raw=os.environ["KEY_P8"]
          if "BEGIN PRIVATE KEY" not in raw:
              body="".join(raw.split())
              try:
                  dec=base64.b64decode(body)
                  if dec[:1]==b"0": raw="-----BEGIN PRIVATE KEY-----\n"+"\n".join(body[i:i+64] for i in range(0,len(body),64))+"\n-----END PRIVATE KEY-----\n"   # نص المفتاح بدون سطري BEGIN/END
                  else: raw=dec.decode()
              except Exception: pass
          def shape(v):
              v=v or ""
              return f"len={len(v)} dashes={v.count('-')} spaces={sum(c.isspace() for c in v)} upper={sum(c.isupper() for c in v)} looksUUID={bool(re.search(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}',v))} looksP8={'PRIVATE KEY' in v}"
          print("::notice::ISSUER shape: "+shape(iss)); print("::notice::P8 shape: "+shape(raw if len(raw)<80 else raw[:0]+'x'*len(raw)) if 'PRIVATE KEY' not in raw else "::notice::P8 shape: looksP8=True len="+str(len(raw)))
          m=re.search(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}',iss)
          if m: iss=m.group(0).lower()
          notes=[]
          notes.append(f"KEY_ID: {len(kid)} chars, {'OK' if re.fullmatch(r'[A-Z0-9]{10}',kid) else 'BAD format (expected 10 uppercase letters/digits)'}")
          notes.append(f"ISSUER_ID: {'OK uuid' if re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',iss) else 'BAD format (expected uuid)'}")
          notes.append(f"P8: {'has BEGIN/END' if ('BEGIN PRIVATE KEY' in raw and 'END PRIVATE KEY' in raw) else 'MISSING BEGIN/END lines'}")
          status="not tried"
          try:
              tok=jwt.encode({"iss":iss,"iat":int(time.time()),"exp":int(time.time())+600,"aud":"appstoreconnect-v1"},raw,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
              req=urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId,name",headers={"Authorization":"Bearer "+tok})
              try:
                  r=urllib.request.urlopen(req,timeout=30); d=json.load(r)
                  status="HTTP 200 apps="+",".join(a["attributes"]["bundleId"] for a in d.get("data",[]))
              except urllib.error.HTTPError as e:
                  status=f"HTTP {e.code} {e.read()[:300].decode(errors='ignore')}"
          except Exception as e:
              status="key error: "+type(e).__name__+" "+str(e)[:150]
          msg=" | ".join(notes+["Apple API: "+status])
          print(msg)
          print(("::notice::" if status.startswith("HTTP 200") else "::error::")+msg)
          if not status.startswith("HTTP 200"): raise SystemExit(1)
          PY

      - name: Archive
        if: env.DO_UPLOAD == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 || secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::السر $v غير موجود في إعدادات المستودع (Settings → Secrets → Actions)"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # يقبل نص الملف كما هو (BEGIN PRIVATE KEY) أو بصيغة Base64
          if printf '%s' "$KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          else
            BODY="$(printf '%s' "$KEY_P8" | tr -d ' \r\n\t')"
            if printf '%s' "$BODY" | base64 --decode 2>/dev/null | head -c1 | grep -q '0'; then
              { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY_PATH"
            else printf '%s' "$BODY" | base64 --decode > "$KEY_PATH"; fi
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dalil.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" OTHER_LDFLAGS='$(inherited) -weak_framework PushToTalk' \
            TARGETED_DEVICE_FAMILY=1 \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { echo "::error::$(grep -E 'error:' "$RUNNER_TEMP/archive.log" | head -12 | paste -sd '|' -)"; tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          # الأرشيف غير موقّع؛ نوقّعه توقيعًا مؤقتًا مع الصلاحيات حتى يحتفظ بها التوقيع السحابي عند التصدير
          APP="$RUNNER_TEMP/Dalil.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign - --timestamp=none "$f"; done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --timestamp=none "$APP"
          echo "::notice::archive entitlements: $(codesign -d --entitlements :- "$APP" 2>/dev/null | tr -d '\n\t ' | grep -o 'aps-environment</key><string>[a-z]*' || echo NONE)"

      - name: Upload to TestFlight
        if: env.DO_UPLOAD == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          # التوقيع يتم هنا بشهادة التوزيع السحابية من أبل (لا يحتاج تسجيل أجهزة)
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dalil.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { echo "::error::$(grep -iE 'error|fail' "$RUNNER_TEMP/export.log" | head -12 | paste -sd '|' -)"; tail -60 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/export.log"

      - name: Verify signed entitlements
        if: env.DO_UPLOAD == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # تصدير محلي (بدون رفع) للتأكد أن التوقيع النهائي يحمل صلاحية التنبيهات
          sed 's#<string>upload</string>#<string>export</string>#' "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportLocal.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dalil.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" \
            -exportPath "$RUNNER_TEMP/ipa" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" > "$RUNNER_TEMP/export2.log" 2>&1 || { echo "::warning::local export failed: $(grep -iE 'error' "$RUNNER_TEMP/export2.log" | head -5 | paste -sd '|' -)"; exit 0; }
          cd "$RUNNER_TEMP/ipa" && unzip -q -o *.ipa
          echo "::notice::signed entitlements: $(codesign -d --entitlements :- Payload/App.app 2>/dev/null | tr -d '\n\t ' | grep -o 'aps-environment</key><string>[a-z]*' || echo NONE)"
          echo "::notice::تم رفع النسخة $MARKETING_VERSION ($BUILD_NUMBER) إلى App Store Connect"
          echo "✅ رُفعت النسخة $MARKETING_VERSION ($BUILD_NUMBER) إلى App Store Connect — تظهر في TestFlight بعد المعالجة (10–30 دقيقة)."
