# حالة الفياض: تحديث يومي (من 6 نوفمبر؛ قبل مرتين بالأسبوع) من Sentinel-2 (10 م) وMODIS (Planetary Computer) → data/fayd.json
name: Fayd
on:
  schedule: [{ cron: "17 21 * * *" }]   # 24 نوفمبر: 12:17 بالليل بتوقيت الرياض (كان 6:17 الصبح)
  workflow_dispatch:
    inputs:
      mode: { description: "baseline أو s2base أو force (ينشر حتى لو تغيّر كثير) أو فاضي للتحديث", type: string, default: "" }
jobs:
  fayd:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: write, issues: write, actions: read }
    steps:
      - id: g
        if: github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # 24 نوفمبر (أبو مالك: «سوه»): GitHub يأخر المواعيد ساعات — لو فيه تشغيل ناجح أو شغال خلال آخر 12 ساعة، المتأخر يوقف بدل ما يكرر نفس الشغل
          since=$(date -u -d "-12 hours" +%FT%TZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fayd.yml -L 10 --json databaseId,createdAt,status,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .createdAt > \"$since\" and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          echo "recent runs: $n"; if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::تشغيل قريب موجود — هذا المتأخر وقف"; fi
      - if: steps.g.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.g.outputs.skip != '1'
        run: pip install --quiet rasterio numpy
      - if: steps.g.outputs.skip != '1'
        run: python3 tools/fayd/update.py ${{ inputs.mode }}
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
      - if: steps.g.outputs.skip != '1'
        name: New-green confidence (layer + shape + rain)
        continue-on-error: true
        run: pip install --quiet numpy pillow && python3 tools/fayd/newconf.py
      - if: steps.g.outputs.skip != '1'
        name: Commit
        run: |
          git config user.email ci@dalil && git config user.name "dalil-bot"
          git add -A -- 'data/fayd*.json' 'data/fayd-qa.md' 2>/dev/null || git add -A -- 'data/fayd*.json'
          git diff --cached --quiet && exit 0
          git commit -qm "حالة الفياض: تحديث تلقائي"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          git status -sb | head -1 | grep -q ahead && { echo "::error::push failed"; git status --short | head; exit 1; } || true
          echo "::notice::$(head -c 200 data/fayd.json 2>/dev/null)"
      - name: Alert developer if held
        if: always() && steps.g.outputs.skip != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f data/fayd-qa.md ] || exit 0
          T="⚠️ فحص الفياض $(date -u +%F)"
          gh issue list --state open --search "$T in:title" --json number -q '.[0].number' | grep -q . && exit 0
          gh issue create --title "$T" --body-file data/fayd-qa.md
