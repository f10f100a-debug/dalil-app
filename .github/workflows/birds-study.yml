# دراسة هجرة الطيور (GBIF + ERA5) — يدوي، والنتيجة في فرع birds-study
name: Birds study
on:
  workflow_dispatch:
    inputs:
      script: { description: "study.py or study2.py", default: "study.py" }
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/birds }
      - name: Previous results
        run: git fetch -q origin birds-study && for f in birds_study.json birds_full.json; do git show origin/birds-study:$f > $f || true; done
      - run: python3 tools/birds/${{ inputs.script || 'study.py' }}
      - name: Publish
        run: |
          mkdir pub && cp birds_*.json pub/ && cd pub && git init -q && git checkout -q -b birds-study
          git config user.email ci@dalil && git config user.name ci
          git add . && git commit -qm "birds study" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" birds-study
