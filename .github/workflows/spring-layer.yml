# طبقة الربيع الدقيقة: وين اخضرّت الأرض بعد المطر (تصنيف ~20 م + صورة القمر ~10 م حول الفياض)
# مرتين بالأسبوع (الثلاثاء والسبت) — أجزاء 2°×2° مع بعض، وبعدها دمج ورفع لفرع spring-data (بدون تاريخ عشان المستودع ما يكبر)
name: Spring layer
on:
  schedule: [{ cron: "23 19 * * 1,5" }]   # 24 نوفمبر: 10:23 مساء الاثنين والجمعة بتوقيت الرياض (كان 4 الفجر — GitHub يتأخر لين 10 ساعات)
  workflow_dispatch:
    inputs:
      bbox: { description: "جزء واحد للتجربة: غرب,جنوب,شرق,شمال (فاضي = كل المناطق)", type: string, default: "" }
      d: { description: "حد الزيادة عن الصيف (افتراضي 0.03)", type: string, default: "" }
      from_run: { description: "دمج بس من أجزاء تشغيل سابق (رقمه) بدون مسح جديد", type: string, default: "" }
permissions: { contents: write, actions: write, issues: write }
jobs:
  plan:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    outputs: { m: "${{ steps.p.outputs.m }}", skip: "${{ steps.g.outputs.skip }}" }
    steps:
      - id: g
        if: github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # 24 نوفمبر (أبو مالك: «سوه»): GitHub يأخر المواعيد ساعات — لو فيه تشغيل ناجح أو شغال خلال آخر 20 ساعة، المتأخر يوقف بدل ما يكرر نفس الشغل
          since=$(date -u -d "-20 hours" +%FT%TZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow spring-layer.yml -L 10 --json databaseId,createdAt,status,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .createdAt > \"$since\" and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          echo "recent runs: $n"; if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::تشغيل قريب موجود — هذا المتأخر وقف"; fi
      - uses: actions/checkout@v4
        if: steps.g.outputs.skip != '1'
      - id: p
        if: steps.g.outputs.skip != '1'
        env: { BBOX: "${{ inputs.bbox }}" }
        run: echo "m=$(python3 tools/fayd/spring_parts.py)" >> "$GITHUB_OUTPUT"
  parts:
    needs: plan
    if: needs.plan.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet rasterio numpy pillow
      - env: { SPRING_BBOX: "${{ matrix.bbox }}", SPRING_D: "${{ inputs.d }}", SPRING_OUT: "out" }
        run: |
          python3 tools/fayd/springlayer.py
          python3 -c "import json;json.dump({'bbox':[float(x) for x in '${{ matrix.bbox }}'.split(',')]},open('out/part.json','w'))"
      - uses: actions/upload-artifact@v4
        with: { name: "spring-${{ matrix.i }}", path: out/, retention-days: 3 }
  merge:
    needs: parts
    if: always() && (needs.parts.result != 'skipped' || inputs.from_run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          mkdir prev
          if git fetch -q origin spring-data 2>/dev/null; then git archive FETCH_HEAD | tar -x -C prev; fi
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "spring-*", run-id: "${{ inputs.from_run || github.run_id }}", github-token: "${{ github.token }}" }
      - run: python3 tools/fayd/spring_merge.py prev parts outd
      - run: pip install --quiet numpy pillow && python3 tools/fayd/spring_fayd.py outd && python3 tools/fayd/spring_satpick.py outd && python3 tools/fayd/spring_tiles.py outd   # درجة كل فيضة + بلاطات الخريطة
      - name: Push spring-data (single commit)
        run: |
          cd outd && git init -q && git checkout -q -b spring-data && git add . && git -c user.name=dalil-bot -c user.email=ci@dalil commit -qm "طبقة الربيع $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" spring-data
      - name: Fayd update (uses the new layer levels)
        if: ${{ !inputs.bbox }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run fayd.yml -R "${{ github.repository }}" -r main
      - name: Alert developer (big change)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f spring-qa.md ] || exit 0
          gh issue create -R "${{ github.repository }}" --title "⚠️ طبقة الربيع $(date -u +%F)" --body-file spring-qa.md
