name: Rooms UI e2e
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Serve app
        run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1
      - name: Map weather layers
        if: always()
        run: mkdir -p shots && node tools/rooms/maplayers.cjs 2>&1 | tee shots/maplog.txt
      - name: Run e2e
        run: mkdir -p shots && set -o pipefail && SHOTS=shots node tools/rooms/e2e.cjs 2>&1 | tee shots/log.txt
      - name: Publish screenshots to ci-shots branch
        if: always()
        run: |
          mkdir -p shots && touch shots/.keep
          cd shots && git init -q && git checkout -q -b ci-shots
          git config user.email ci@dalil && git config user.name ci
          git add . && git commit -qm "e2e ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
