name: CHIRPS probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://data.chc.ucsb.edu/products/CHIRPS-2.0/prelim/global_daily/tifs/p05/2026/ \
                   https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/tifs/p05/2026/ \
                   https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/tifs/p25/2025/ \
                   https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/ \
                   https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/ \
                   https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/prelim/ \
                   https://data.chc.ucsb.edu/products/CHIRP/daily/ ; do
            code=$(curl -s -o b.html -w '%{http_code}' -A "dalil-app/1.0" "$u")
            echo "::notice::$u -> $code | $(grep -o 'href="[^"]*"' b.html | tail -6 | tr '\n' ' ' | head -c 600)"
          done
