# فحص مصادر أسماء مفتوحة (NGA GNS = ملكية عامة، Wikidata = CC0): عدّ فقط، ما يُنشر شيء
name: Names probe
on:
  push:
    branches: [map-details]
    paths: [".github/workflows/names-probe.yml", "tools/places/probe_names.py"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 tools/places/probe_names.py
