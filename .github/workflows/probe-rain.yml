name: probe-rain
on: { push: { branches: [probe-rain] } }
concurrency: { group: probe-rain, cancel-in-progress: true }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, html, urllib.request
          for day in (11, 20):
              u=f"https://www.ogimet.com/cgi-bin/gsynres?ind=40356&ndays=4&ano=2026&mes=10&day={day}&hora=18&lang=en&decoded=yes"
              t=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"dalil-app/1.0"}),timeout=60).read().decode("latin-1")
              txt=re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]*>"," ",t)))
              i=txt.find("10/10/2026 00:00"); print("::notice::d"+str(day)+" "+txt[max(0,i-300):i+500])
          u="https://www.ogimet.com/cgi-bin/getsynop?block=40356&begin=202610091200&end=202610130000"
          t=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"dalil-app/1.0"}),timeout=60).read().decode("latin-1")
          print("::notice::RAW "+t.replace("\n"," || ")[:3000])
          PY
