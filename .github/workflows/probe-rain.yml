name: probe-rain
on: { push: { branches: [probe-rain] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cp data/fq.json /tmp/fq_before.json && python3 tools/fayd/fq.py
      - run: |
          python3 - <<'PY'
          import json
          a={r['name']:r for r in json.load(open('/tmp/fq_before.json'))['rows']}; b=json.load(open('data/fq.json'))['rows']
          ch=[f"{r['name']} {a[r['name']]['mm']}→{r['mm']} (قبل الوسم {a[r['name']]['pre']}→{r['pre']}) st{a[r['name']]['st']}→{r['st']} محطة:{r.get('gauge')}" for r in b if r['name'] in a]
          print("::notice::FQ " + " || ".join(ch[:12])); print("::notice::FQ2 " + " || ".join(ch[12:]))
          s=json.load(open('data/synop-rain.json'))['stations']
          print("::notice::SYN " + " || ".join(k+":"+" ".join(f"{d[5:]}={v}" for d,v in sorted(x.items()) if v>0) for k,x in s.items()))
          PY
      - run: pip install --quiet rasterio numpy && python3 tools/fayd/update.py
      - run: |
          git config user.email ci@dalil && git config user.name "dalil-bot"
          git add -f data/fq.json data/synop-rain.json data/fayd.json && git commit -qm "probe results" && git push -q origin HEAD:probe-rain-out -f
