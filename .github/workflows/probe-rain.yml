name: probe-rain
on: { push: { branches: [probe-rain] } }
concurrency: { group: probe-rain, cancel-in-progress: true }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cp data/fq.json /tmp/fq_before.json && python3 tools/fayd/fq.py
      - run: |
          python3 - <<'PY'
          import json
          a={r['name']:r for r in json.load(open('/tmp/fq_before.json'))['rows']}; b=json.load(open('data/fq.json'))['rows']
          ch=[f"{r['name']} {a[r['name']]['mm']}→{r['mm']} pre{a[r['name']]['pre']}→{r['pre']} st{a[r['name']]['st']}→{r['st']} {r.get('gauge')}" for r in b if r['name'] in a and (r['mm']!=a[r['name']]['mm'] or r['pre']!=a[r['name']]['pre'] or r.get('gauge'))]
          print("::notice::FQ " + " || ".join(ch))
          s=json.load(open('data/synop-rain.json'))['stations']
          print("::notice::SYN " + " || ".join(k+f"[{len(x)}d]:"+" ".join(f"{d[5:]}={v}" for d,v in sorted(x.items()) if v>0) for k,x in s.items()))
          PY
      - run: pip install --quiet rasterio numpy && python3 tools/fayd/update.py
