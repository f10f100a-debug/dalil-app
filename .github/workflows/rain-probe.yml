name: rain-probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q numpy
      - run: python3 tools/rainprobe/probe.py > /tmp/out.txt 2>&1 || true
      - run: |
          git config user.name "dalil-bot"; git config user.email "bot@users.noreply.github.com"
          cp cmorph.npz /tmp/ 2>/dev/null || true
          git checkout --orphan probe-out && git rm -rq --cached . && cp /tmp/out.txt out.txt && cp /tmp/cmorph.npz . 2>/dev/null; git add out.txt cmorph.npz 2>/dev/null; git add out.txt && git commit -qm probe && git push -f origin probe-out
