# مطر الأسبوع (تجربة مخفية في الخريطة): يُحسب مرتين يوميًا (6:07 ص و 6:07 م بتوقيت الرياض)
name: Rain week
on:
  schedule: [{ cron: "7 3,15 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: rain-week, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wx/rain_week.py
      - name: Commit
        run: |
          git config user.name dalil-bot && git config user.email bot@users.noreply.github.com
          git add data/rain-week.json && git commit -qm "rain-week $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
