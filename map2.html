<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#1C1A17">
<title>دليل — خريطة البر الجديدة (تجريبية)</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1A17;--sand:#C9964F;--sand-ink:#5C3A0E;--paper:#FBF7EF;--line:#E4D9C6;--dim:#7A6E5E;--red:#8E1E17;--red-bg:#F7E4E1}
html,body{height:100%;margin:0;background:#EFE4CF;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
[hidden]{display:none!important}
#map{position:fixed;inset:0}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:10px;z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.chip{background:rgba(251,247,239,.95);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(40,25,5,.12);font-size:13px}
.title b{display:block;font-size:14px}.title small{color:var(--dim);font-size:11.5px}
.btn{all:unset;cursor:pointer;background:var(--sand);color:var(--ink);font-weight:700;font-size:13px;border-radius:12px;padding:9px 13px;border:1px solid #B07F3C;box-shadow:0 4px 14px rgba(40,25,5,.15)}
.btn.ghost{background:rgba(251,247,239,.95);border-color:var(--line);font-weight:600}
.btn:focus-visible{outline:2px solid var(--sand-ink);outline-offset:2px}
.grow{flex:1}
#offline{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:10px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#offline .msg{flex:1;min-width:0}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
.maplibregl-ctrl-top-left{top:calc(env(safe-area-inset-top,0px) + 64px)}
.maplibregl-popup-content{font-family:inherit;border-radius:14px;padding:12px 14px;direction:rtl;text-align:right;min-width:170px}
.pop b{display:block;font-size:15px}.pop small{color:var(--dim)}
.pop .hz{margin-top:6px;background:var(--red-bg);color:var(--red);border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:600}
.pop .btn{display:block;text-align:center;margin-top:8px;padding:8px 10px}
</style>
</head>
<body>
<div id="map" role="application" aria-label="خريطة البر"></div>
<div class="bar">
  <button class="btn ghost" id="back" type="button">→ رجوع</button>
  <div class="chip title grow"><b>خريطة البر الجديدة — الرياض</b><small>تجريبية · OpenStreetMap و Copernicus</small></div>
</div>
<div id="offline" class="chip"><span class="msg" id="offMsg">…</span><button class="btn" id="offBtn" type="button" hidden>تنزيل للاستخدام بدون إنترنت</button></div>

<script src="vendor/maplibre-gl-csp.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
(async()=>{
'use strict';
const abs = p => new URL(p, location.href).href;
const MAPS = [abs('maps/riyadh.pmtiles?v=1'), abs('maps/riyadh-hillshade.pmtiles?v=1')];
const OFFLINE_CACHE = 'dalil-offline-maps-v1';
const $ = id => document.getElementById(id);
const HAZARD = {'سبخة':'أرض رخوة قد تغرز فيها السيارة، خصوصًا بعد المطر.','حرة':'أرض بركانية وعرة تتلف الإطارات؛ خفّف السرعة.','دحل':'فتحة أو كهف في الأرض؛ احذر السقوط عند الاقتراب.','كهف':'كهف أو غار؛ لا تدخله دون إضاءة ومرافق.'};
$('back').onclick = () => { history.length > 1 ? history.back() : location.href = 'index.html'; };

maplibregl.setWorkerUrl(abs('vendor/maplibre-gl-csp-worker.js'));
try{ maplibregl.setRTLTextPlugin(abs('vendor/mapbox-gl-rtl-text.js'), true); }catch(e){}
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

// ---------- بدون إنترنت: الملف كاملًا في Cache API ويُقرأ منه مباشرة ----------
async function cachedFiles(){
  try{
    const c = await caches.open(OFFLINE_CACHE); let n = 0, size = 0;
    for(const u of MAPS){
      const r = await c.match(u); if(!r) continue;
      const b = await r.blob(); size += b.size; n++;
      protocol.add(new pmtiles.PMTiles(new pmtiles.FileSource(new File([b], u))));
    }
    return {all: n === MAPS.length, size};
  }catch(e){ return {all:false, size:0}; }
}
const mb = b => (b / 1048576).toFixed(0) + ' MB';
async function totalSize(){
  let s = 0;
  for(const u of MAPS){ try{ const r = await fetch(u, {method:'HEAD'}); s += Number(r.headers.get('content-length')) || 0; }catch(e){} }
  return s;
}
const off = await cachedFiles();
if(off.all) $('offMsg').textContent = 'محفوظة في جهازك وتعمل بدون إنترنت (' + mb(off.size) + ').';
else {
  $('offMsg').textContent = navigator.onLine ? 'تعمل الآن مع الإنترنت.' : 'لا يوجد اتصال، والخريطة غير محفوظة بعد.';
  if(navigator.onLine){ const s = await totalSize(); $('offBtn').hidden = false; if(s) $('offBtn').textContent = 'تنزيل للاستخدام بدون إنترنت (' + mb(s) + ')'; }
}
$('offBtn').onclick = async () => {
  $('offBtn').disabled = true; $('offBtn').textContent = 'جارٍ التنزيل…';
  try{
    const c = await caches.open(OFFLINE_CACHE);
    for(const u of MAPS){ const r = await fetch(u, {cache:'no-store'}); if(!r.ok || r.status !== 200) throw new Error(r.status); await c.put(u, r); }
    $('offBtn').hidden = true; $('offMsg').textContent = 'تم الحفظ. ستعمل الخريطة بدون إنترنت من الآن.';
  }catch(e){ $('offBtn').disabled = false; $('offBtn').textContent = 'تعذّر التنزيل — أعد المحاولة'; }
};

// ---------- الأسلوب: ألوان البر ----------
const T = ['Noto Sans Regular'];
const kindColor = ['match', ['get','kind'],
  'جبل','#7A5230', 'مورد ماء','#1F6FA8', 'تجمع مياه','#3E86B4', 'نفود','#C98A2E', 'آثار','#7A4E9A', 'معلم رئيسي','#3B342B',
  'سبخة','#B3261E', 'حرة','#B3261E', 'دحل','#B3261E', 'كهف','#B3261E', 'موقع خطر','#B3261E', '#6F665A'];
// عرض الطريق حسب تصنيفه: قيمة عند التكبير 6 وأخرى عند 15 ({class: [a, b]}، والباقي للافتراضي)
const roadW = (t, def) => ['interpolate', ['exponential', 1.6], ['zoom'],
  6, ['match', ['get','class'], ...Object.entries(t).flatMap(([k, v]) => [k, v[0]]), def[0]],
  15, ['match', ['get','class'], ...Object.entries(t).flatMap(([k, v]) => [k, v[1]]), def[1]]];
// الطرق الكبرى تُرسم فوق الصغرى
const ROAD_RANK = ['match', ['get','class'], 'motorway',7, 'trunk',6, 'primary',5, 'secondary',4, 'tertiary',3, 'minor',2, 1];
const style = {
  version: 8,
  glyphs: abs('vendor/glyphs/') + '{fontstack}/{range}.pbf',
  sources: {
    base: {type:'vector', url:'pmtiles://' + MAPS[0], attribution:'© <a href="https://www.openstreetmap.org/copyright">مساهمو OpenStreetMap</a>'},
    hs: {type:'raster', url:'pmtiles://' + MAPS[1], tileSize:256, attribution:'Copernicus DEM © DLR/Airbus، الاتحاد الأوروبي و ESA'}
  },
  layers: [
    {id:'bg', type:'background', paint:{'background-color':'#EFE4CF'}},
    {id:'sand', type:'fill', source:'base', 'source-layer':'sand', paint:{'fill-color':'#F4DFAE', 'fill-opacity':.8}},
    {id:'farm', type:'fill', source:'base', 'source-layer':'landuse', filter:['==',['get','kind'],'farm'], paint:{'fill-color':'#CFDDA8', 'fill-opacity':.85}},
    {id:'park', type:'fill', source:'base', 'source-layer':'landuse', filter:['==',['get','kind'],'park'], paint:{'fill-color':'#C9DDB0', 'fill-opacity':.8}},
    {id:'urban', type:'fill', source:'base', 'source-layer':'landuse', filter:['in',['get','kind'],['literal',['urban','quarry']]], paint:{'fill-color':'#E3D6C3', 'fill-opacity':.9}},
    {id:'hillshade', type:'raster', source:'hs', paint:{'raster-opacity':['interpolate',['linear'],['zoom'],7,.9,13,.7], 'raster-fade-duration':0}},
    {id:'water', type:'fill', source:'base', 'source-layer':'water', paint:{'fill-color':'#9CC6DD'}},
    {id:'contour', type:'line', source:'base', 'source-layer':'contour', paint:{'line-color':'#9B7446', 'line-opacity':['case',['==',['get','idx'],1],.55,.3], 'line-width':['case',['==',['get','idx'],1],.9,.45]}},
    {id:'waterway', type:'line', source:'base', 'source-layer':'waterway', paint:{'line-color':'#7FB3D5', 'line-width':.7}},
    {id:'wadi', type:'line', source:'base', 'source-layer':'wadi', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#3E86B4', 'line-width':['interpolate',['linear'],['zoom'],8,.8,14,2.4], 'line-opacity':.85}},
    {id:'cliff', type:'line', source:'base', 'source-layer':'cliff', paint:{'line-color':'#6E4B26', 'line-width':1, 'line-dasharray':[1,1]}},
    {id:'track', type:'line', source:'base', 'source-layer':'roads', filter:['==',['get','class'],'track'], paint:{'line-color':'#8A6A40', 'line-width':1, 'line-dasharray':[3,2]}},
    {id:'rail', type:'line', source:'base', 'source-layer':'roads', filter:['==',['get','class'],'rail'], paint:{'line-color':'#6F665A', 'line-width':1.2, 'line-dasharray':[4,3]}},
    {id:'road-case', type:'line', source:'base', 'source-layer':'roads', filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary','minor','service']]], layout:{'line-cap':'round','line-join':'round', 'line-sort-key':ROAD_RANK},
      paint:{'line-color':'#A89378', 'line-width':roadW({motorway:[1.6,14], trunk:[1.6,14], primary:[1.2,12], secondary:[1,10], tertiary:[.8,9]}, [.5,7])}},
    {id:'road', type:'line', source:'base', 'source-layer':'roads', filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary','minor','service']]], layout:{'line-cap':'round','line-join':'round', 'line-sort-key':ROAD_RANK},
      paint:{'line-color':['match',['get','class'],'motorway','#E0823C','trunk','#E0823C','primary','#F0B45A','secondary','#F7D38B','#FFFFFF'],
             'line-width':roadW({motorway:[1,12], trunk:[1,12], primary:[.8,10], secondary:[.6,8], tertiary:[.5,7]}, [.3,5])}},
    {id:'contour-label', type:'symbol', source:'base', 'source-layer':'contour', minzoom:11, filter:['==',['get','idx'],1],
      layout:{'symbol-placement':'line', 'text-field':['concat',['to-string',['get','ele']],' م'], 'text-font':T, 'text-size':10}, paint:{'text-color':'#7A5A32', 'text-halo-color':'#F3EADA', 'text-halo-width':1.2}},
    {id:'wadi-label', type:'symbol', source:'base', 'source-layer':'wadi', minzoom:10,
      layout:{'symbol-placement':'line', 'text-field':['get','name'], 'text-font':T, 'text-size':12, 'symbol-spacing':400}, paint:{'text-color':'#1F5E86', 'text-halo-color':'#fff', 'text-halo-width':1.5}},
    {id:'road-label', type:'symbol', source:'base', 'source-layer':'roads', minzoom:12, filter:['all',['has','name'],['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary']]]],
      layout:{'symbol-placement':'line', 'text-field':['get','name'], 'text-font':T, 'text-size':11}, paint:{'text-color':'#4A3A26', 'text-halo-color':'#fff', 'text-halo-width':1.5}},
    {id:'peak', type:'symbol', source:'base', 'source-layer':'peaks',
      layout:{'text-field':['concat','▲ ',['coalesce',['get','name'],''],['case',['has','ele'],['concat','\n',['to-string',['get','ele']],' م'],'']], 'text-font':T, 'text-size':11, 'text-anchor':'top'}, paint:{'text-color':'#5C3A0E', 'text-halo-color':'#F3EADA', 'text-halo-width':1.3}},
    {id:'dalil', type:'circle', source:'base', 'source-layer':'dalil',
      paint:{'circle-color':kindColor, 'circle-radius':['interpolate',['linear'],['zoom'],11,3.5,15,7], 'circle-stroke-color':'#fff', 'circle-stroke-width':1.3}},
    {id:'dalil-label', type:'symbol', source:'base', 'source-layer':'dalil', minzoom:12,
      layout:{'text-field':['get','name'], 'text-font':T, 'text-size':11.5, 'text-offset':[0,.9], 'text-anchor':'top', 'text-optional':true}, paint:{'text-color':kindColor, 'text-halo-color':'#fff', 'text-halo-width':1.5}},
    {id:'place', type:'symbol', source:'base', 'source-layer':'places',
      layout:{'text-field':['get','name'], 'text-font':T, 'text-size':['match',['get','kind'],'city',17,'town',14,'village',12.5,'hamlet',11.5,11], 'text-max-width':8},
      paint:{'text-color':['match',['get','kind'],'neighborhood','#6F665A','#231F1A'], 'text-halo-color':'rgba(255,255,255,.9)', 'text-halo-width':1.6}}
  ]
};

// المركز: موقعك إن كان داخل النطاق، وإلا الرياض
const qs = new URLSearchParams(location.search), qLat = Number(qs.get('lat')), qLng = Number(qs.get('lng')), qZ = Number(qs.get('z'));
const hasQ = Number.isFinite(qLat) && Number.isFinite(qLng) && qs.has('lat');
const map = new maplibregl.Map({container:'map', style, center: hasQ ? [qLng, qLat] : [46.7, 24.7], zoom: hasQ ? (qZ || 13) : 9, minZoom:6, maxZoom:17, maxBounds:[[44.9,23.2],[48.4,26.4]], attributionControl:false});
const attrib = new maplibregl.AttributionControl({compact:true});
map.addControl(attrib, 'bottom-right');
map.once('idle', () => { const el = document.querySelector('.maplibregl-ctrl-attrib'); if(el) el.classList.remove('maplibregl-compact-show'); });
map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-left');
map.addControl(new maplibregl.NavigationControl({visualizePitch:false}), 'top-left');
const geo = new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}, trackUserLocation:true, showAccuracyCircle:true});
map.addControl(geo, 'top-left');
map.on('load', () => { if(!hasQ) try{ geo.trigger(); }catch(e){} });

// الضغط على موقع من مواقع دليل: الاسم والتصنيف والتنبيه وزر التوجّه بالبوصلة
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
map.on('click', 'dalil', e => {
  const f = e.features[0], p = f.properties, [lng, lat] = f.geometry.coordinates;
  const url = 'index.html?screen=compass&navLat=' + lat.toFixed(6) + '&navLng=' + lng.toFixed(6) + '&navLabel=' + encodeURIComponent(p.name);
  new maplibregl.Popup({offset:10}).setLngLat([lng, lat]).setHTML(
    `<div class="pop"><b>${esc(p.name)}</b><small>${esc(p.kind)}</small>${HAZARD[p.kind] ? `<div class="hz">${esc(HAZARD[p.kind])}</div>` : ''}<a class="btn" href="${url}">توجّه بالبوصلة</a></div>`).addTo(map);
});
map.on('mouseenter', 'dalil', () => map.getCanvas().style.cursor = 'pointer');
map.on('mouseleave', 'dalil', () => map.getCanvas().style.cursor = '');
})();
</script>
</body>
</html>
