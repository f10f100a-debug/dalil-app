<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.maps.eox.at https://s3.amazonaws.com; connect-src 'self' https://tiles.maps.eox.at https://s3.amazonaws.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#1C1A17">
<title>دليل — حفظ الخرائط للبر</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1A17;--sand:#C9964F;--sand-ink:#5C3A0E;--paper:#FBF7EF;--line:#E4D9C6;--dim:#7A6E5E;--red:#8E1E17;--red-bg:#F7E4E1;--green:#2F7A4B}
html,body{height:100%;margin:0;background:#EFE4CF;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
[hidden]{display:none!important}
#map{position:fixed;inset:0}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:10px;z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.chip{background:rgba(251,247,239,.95);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(40,25,5,.12);font-size:13px}
.title b{display:block;font-size:14px}.title small{color:var(--dim);font-size:11.5px}
.btn{all:unset;pointer-events:auto;cursor:pointer;background:var(--sand);color:var(--ink);font-weight:700;font-size:13px;border-radius:12px;padding:9px 13px;border:1px solid #B07F3C;box-shadow:0 4px 14px rgba(40,25,5,.15);text-align:center}
.btn.ghost{background:rgba(251,247,239,.95);border-color:var(--line);font-weight:600;box-shadow:none}
.btn.small{padding:6px 10px;font-size:12.5px;box-shadow:none}
.btn:focus-visible{outline:2px solid var(--sand-ink);outline-offset:2px}
.grow{flex:1;min-width:0}
#dl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:10px;z-index:5;display:flex;gap:10px;align-items:center}
#dl{flex-wrap:wrap}
#dl .msg{flex:1 1 100%;min-width:0;line-height:1.6}
#dlSave{flex:1}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:8;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(40,25,5,.25);max-height:72%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#sheet header b{flex:1;font-size:16px}
#sheet .note{padding:0 16px 8px;color:var(--dim);font-size:12.5px;line-height:1.6}
#list{overflow:auto;padding:0 12px 14px;display:grid;gap:8px}
.reg{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.reg .n{flex:1;min-width:0}.reg .n b{display:block;font-size:14px}.reg .n small{color:var(--dim);font-size:12px}
.reg.here{border-color:var(--sand)}
.ok{color:var(--green);font-weight:700}
.maplibregl-ctrl-attrib{font-size:10px}
/* العرض الثلاثي */
#td{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);inset-inline:10px;z-index:5;display:grid;gap:8px;padding:10px 12px}
#td .row{display:flex;align-items:center;gap:10px}
#td input[type=range]{flex:1;accent-color:var(--sand)}
#td label{display:flex;align-items:center;gap:6px}
#td input[type=checkbox]{width:20px;height:20px;accent-color:var(--sand)}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
.maplibregl-ctrl-top-left{top:calc(env(safe-area-inset-top,0px) + 64px)}
.maplibregl-popup-content{font-family:inherit;border-radius:14px;padding:12px 14px;direction:rtl;text-align:right;min-width:170px}
.pop b{display:block;font-size:15px}.pop small{color:var(--dim)}
.pop .hz{margin-top:6px;background:var(--red-bg);color:var(--red);border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:600}
.pop .btn{display:block;margin-top:8px;padding:8px 10px}
</style>
</head>
<body>
<div id="map" role="application" aria-label="خريطة البر"></div>
<div class="bar">
  <button class="btn ghost" id="back" type="button">→ رجوع</button>
  <div class="chip title grow"><b id="title">حفظ الخرائط للبر</b><small>OpenStreetMap و Copernicus</small></div>
</div>
<div id="td" class="chip" hidden>
  <div class="row"><span>تضخيم الارتفاع</span><input type="range" id="tdEx" min="1" max="3" step="0.1" value="1.6" aria-label="تضخيم الارتفاع"><b id="tdExV">1.6×</b></div>
  <div class="row"><label><input type="checkbox" id="tdSat">صور فضائية</label><span class="grow"></span><button class="btn ghost small" id="tdFlat" type="button">مستوٍ 2D</button></div>
</div>
<div id="dl" class="chip"><span class="msg" id="dlMsg">…</span><button class="btn" id="dlSave" type="button" hidden>احفظها</button><button class="btn ghost" id="dlOpen" type="button">كل المناطق</button></div>
<div id="sheet" hidden role="dialog" aria-labelledby="sheetTitle">
  <header><b id="sheetTitle">حفظ المناطق للاستخدام بدون إنترنت</b><button class="btn ghost small" id="sheetClose" type="button">إغلاق</button></header>
  <div class="note" id="sheetNote">نزّل منطقتك قبل الخروج للبر. كل منطقة تُحفظ مرة واحدة وتعمل بعدها بدون إنترنت.</div>
  <div id="list"></div>
</div>

<script src="vendor/maplibre-gl-csp.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
(async()=>{
'use strict';
const abs = p => new URL(p, location.href).href;
const $ = id => document.getElementById(id);
const OFFLINE_CACHE = 'dalil-offline-maps-v1';
const HAZARD = {'سبخة':'أرض رخوة قد تغرز فيها السيارة، خصوصًا بعد المطر.','حرة':'أرض بركانية وعرة تتلف الإطارات؛ خفّف السرعة.','دحل':'فتحة أو كهف في الأرض؛ احذر السقوط عند الاقتراب.','كهف':'كهف أو غار؛ لا تدخله دون إضاءة ومرافق.'};
const mb = b => Math.max(1, Math.round(b / 1048576)) + ' MB';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// الرجوع دائمًا إلى التطبيق نفسه: سجلّ المتصفح لا يُعتمد عليه في التطبيق المثبّت أو عند الفتح من رابط
$('back').onclick = () => {
  // صفحة الرجوع المحددة (من زر 3D) إن كانت داخل التطبيق، ثم الصفحة السابقة، ثم الإعدادات
  const back = new URLSearchParams(location.search).get('back');
  if(back && /^(index|map)\.html(\?|$)/.test(back)){ location.href = back; return; }
  let ref = null;
  try{ ref = document.referrer && new URL(document.referrer); }catch(e){}
  const embedded = ref && /embed=1/.test(ref.search);
  location.href = ref && ref.origin === location.origin && !/map2\.html/.test(ref.pathname) && !embedded ? ref.href : embedded ? 'index.html?screen=track' : 'index.html?screen=settings';
};

maplibregl.setWorkerUrl(abs('vendor/maplibre-gl-csp-worker.js'));
try{ maplibregl.setRTLTextPlugin(abs('vendor/mapbox-gl-rtl-text.js'), true); }catch(e){}
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

// ---------- المناطق (data/maps.json) ----------
let REGIONS = [];
try{ REGIONS = (await (await fetch('data/maps.json?v=1')).json()).regions; }catch(e){}
const urls = r => [abs('maps/' + r.id + '.pmtiles?v=' + r.v), abs('maps/' + r.id + '-hs.pmtiles?v=' + r.v)];
const saved = new Set();
// المناطق المحفوظة تُقرأ من Cache API مباشرة (قبل أن تطلبها الخريطة من الشبكة)
async function attachCached(r){
  try{
    const c = await caches.open(OFFLINE_CACHE), [u1, u2] = urls(r), a = await c.match(u1), b = await c.match(u2);
    if(!a || !b) return false;
    for(const [u, res] of [[u1, a], [u2, b]]) protocol.add(new pmtiles.PMTiles(new pmtiles.FileSource(new File([await res.blob()], u))));
    saved.add(r.id); return true;
  }catch(e){ return false; }
}
await Promise.all(REGIONS.map(attachCached));

// ---------- الأسلوب: قوالب طبقات تُكرَّر لكل منطقة ظاهرة ----------
const T = ['Noto Sans Regular'];
const kindColor = ['match', ['get','kind'],
  'جبل','#7A5230', 'مورد ماء','#1F6FA8', 'تجمع مياه','#3E86B4', 'نفود','#C98A2E', 'آثار','#7A4E9A', 'معلم رئيسي','#3B342B',
  'سبخة','#B3261E', 'حرة','#B3261E', 'دحل','#B3261E', 'كهف','#B3261E', 'موقع خطر','#B3261E', '#6F665A'];
const roadW = (t, def) => ['interpolate', ['exponential', 1.6], ['zoom'],
  6, ['match', ['get','class'], ...Object.entries(t).flatMap(([k, v]) => [k, v[0]]), def[0]],
  15, ['match', ['get','class'], ...Object.entries(t).flatMap(([k, v]) => [k, v[1]]), def[1]]];
const ROAD_RANK = ['match', ['get','class'], 'motorway',7, 'trunk',6, 'primary',5, 'secondary',4, 'tertiary',3, 'minor',2, 1];
const ROADS = ['literal', ['motorway','trunk','primary','secondary','tertiary','minor']];
const V = 'vt', H = 'hs';   // نوع المصدر لكل قالب
const TPL = [
  {id:'sand', src:V, type:'fill', 'source-layer':'sand', paint:{'fill-color':'#F4DFAE', 'fill-opacity':.8}},
  {id:'farm', src:V, type:'fill', 'source-layer':'landuse', filter:['==',['get','kind'],'farm'], paint:{'fill-color':'#CFDDA8', 'fill-opacity':.85}},
  {id:'park', src:V, type:'fill', 'source-layer':'landuse', filter:['==',['get','kind'],'park'], paint:{'fill-color':'#C9DDB0', 'fill-opacity':.8}},
  {id:'urban', src:V, type:'fill', 'source-layer':'landuse', filter:['in',['get','kind'],['literal',['urban','quarry']]], paint:{'fill-color':'#E3D6C3', 'fill-opacity':.9}},
  {id:'hillshade', src:H, type:'raster', paint:{'raster-opacity':['interpolate',['linear'],['zoom'],6,.95,13,.7], 'raster-fade-duration':0}},
  {id:'water', src:V, type:'fill', 'source-layer':'water', paint:{'fill-color':'#9CC6DD'}},
  {id:'contour', src:V, type:'line', 'source-layer':'contour', paint:{'line-color':'#9B7446', 'line-opacity':['case',['==',['get','idx'],1],.55,.3], 'line-width':['case',['==',['get','idx'],1],.9,.45]}},
  {id:'waterway', src:V, type:'line', 'source-layer':'waterway', paint:{'line-color':'#7FB3D5', 'line-width':.7}},
  {id:'wadi', src:V, type:'line', 'source-layer':'wadi', layout:{'line-cap':'round','line-join':'round'}, paint:{'line-color':'#3E86B4', 'line-width':['interpolate',['linear'],['zoom'],8,.8,14,2.4], 'line-opacity':.85}},
  {id:'cliff', src:V, type:'line', 'source-layer':'cliff', paint:{'line-color':'#6E4B26', 'line-width':1, 'line-dasharray':[1,1]}},
  {id:'track', src:V, type:'line', 'source-layer':'roads', filter:['==',['get','class'],'track'], paint:{'line-color':'#8A6A40', 'line-width':1, 'line-dasharray':[3,2]}},
  {id:'rail', src:V, type:'line', 'source-layer':'roads', filter:['==',['get','class'],'rail'], paint:{'line-color':'#6F665A', 'line-width':1.2, 'line-dasharray':[4,3]}},
  {id:'road-case', src:V, type:'line', 'source-layer':'roads', filter:['in',['get','class'],ROADS], layout:{'line-cap':'round','line-join':'round','line-sort-key':ROAD_RANK},
    paint:{'line-color':'#A89378', 'line-width':roadW({motorway:[1.6,14], trunk:[1.6,14], primary:[1.2,12], secondary:[1,10], tertiary:[.8,9]}, [.5,7])}},
  {id:'road', src:V, type:'line', 'source-layer':'roads', filter:['in',['get','class'],ROADS], layout:{'line-cap':'round','line-join':'round','line-sort-key':ROAD_RANK},
    paint:{'line-color':['match',['get','class'],'motorway','#E0823C','trunk','#E0823C','primary','#F0B45A','secondary','#F7D38B','#FFFFFF'],
           'line-width':roadW({motorway:[1,12], trunk:[1,12], primary:[.8,10], secondary:[.6,8], tertiary:[.5,7]}, [.3,5])}},
  {id:'contour-label', src:V, type:'symbol', 'source-layer':'contour', minzoom:11, filter:['==',['get','idx'],1],
    layout:{'symbol-placement':'line', 'text-field':['concat',['to-string',['get','ele']],' م'], 'text-font':T, 'text-size':10}, paint:{'text-color':'#7A5A32', 'text-halo-color':'#F3EADA', 'text-halo-width':1.2}},
  {id:'wadi-label', src:V, type:'symbol', 'source-layer':'wadi', minzoom:10,
    layout:{'symbol-placement':'line', 'text-field':['get','name'], 'text-font':T, 'text-size':12, 'symbol-spacing':400}, paint:{'text-color':'#1F5E86', 'text-halo-color':'#fff', 'text-halo-width':1.5}},
  {id:'road-label', src:V, type:'symbol', 'source-layer':'roads', minzoom:12, filter:['all',['has','name'],['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary']]]],
    layout:{'symbol-placement':'line', 'text-field':['get','name'], 'text-font':T, 'text-size':11}, paint:{'text-color':'#4A3A26', 'text-halo-color':'#fff', 'text-halo-width':1.5}},
  {id:'peak', src:V, type:'symbol', 'source-layer':'peaks',
    layout:{'text-field':['concat','▲ ',['coalesce',['get','name'],''],['case',['has','ele'],['concat','\n',['to-string',['get','ele']],' م'],'']], 'text-font':T, 'text-size':11, 'text-anchor':'top'}, paint:{'text-color':'#5C3A0E', 'text-halo-color':'#F3EADA', 'text-halo-width':1.3}},
  {id:'dalil', src:V, type:'circle', 'source-layer':'dalil',
    paint:{'circle-color':kindColor, 'circle-radius':['interpolate',['linear'],['zoom'],11,3.5,15,7], 'circle-stroke-color':'#fff', 'circle-stroke-width':1.3}},
  {id:'dalil-label', src:V, type:'symbol', 'source-layer':'dalil', minzoom:12,
    layout:{'text-field':['get','name'], 'text-font':T, 'text-size':11.5, 'text-offset':[0,.9], 'text-anchor':'top', 'text-optional':true}, paint:{'text-color':kindColor, 'text-halo-color':'#fff', 'text-halo-width':1.5}},
  {id:'place', src:V, type:'symbol', 'source-layer':'places',
    layout:{'text-field':['get','name'], 'text-font':T, 'text-size':['match',['get','kind'],'city',17,'town',14,'village',12.5,'hamlet',11.5,11], 'text-max-width':8},
    paint:{'text-color':['match',['get','kind'],'neighborhood','#6F665A','#231F1A'], 'text-halo-color':'rgba(255,255,255,.9)', 'text-halo-width':1.6}}
];
// «فتحات» فارغة تحفظ ترتيب الطبقات: طبقات كل منطقة تُدرج قبل فتحة قالبها
const MODE3D = new URLSearchParams(location.search).get('mode') === '3d';
let SAT = new URLSearchParams(location.search).get('sat') === '1';
const style = {version:8, glyphs:abs('vendor/glyphs/') + '{fontstack}/{range}.pbf',
  sources:{
    sat:{type:'raster', tiles:['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/g/{z}/{y}/{x}.jpg'], tileSize:256, maxzoom:15},
    // ارتفاعات AWS Terrain Tiles (بيانات مفتوحة) للعرض الثلاثي فقط
    dem:{type:'raster-dem', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'], encoding:'terrarium', tileSize:256, maxzoom:14}},
  layers:[{id:'bg', type:'background', paint:{'background-color':'#EFE4CF'}}, {id:'sat', type:'raster', source:'sat', layout:{visibility:SAT ? 'visible' : 'none'}, paint:{'raster-fade-duration':0}}, ...TPL.map(t => ({id:'slot:' + t.id, type:'background', layout:{visibility:'none'}}))]};

const qs = new URLSearchParams(location.search), qLat = Number(qs.get('lat')), qLng = Number(qs.get('lng')), qZ = Number(qs.get('z'));
const hasQ = Number.isFinite(qLat) && Number.isFinite(qLng) && qs.has('lat');
const map = new maplibregl.Map({container:'map', style, center: hasQ ? [qLng, qLat] : [45.3, 24.2], zoom: hasQ ? (qZ || 13) : 5.2,
  minZoom:4.5, maxZoom:17, maxBounds:[[31,13],[60,35]], attributionControl:false, maxPitch:80, pitch: MODE3D ? 62 : 0});
map.addControl(new maplibregl.AttributionControl({compact:true, customAttribution:'© <a href="https://www.openstreetmap.org/copyright">مساهمو OpenStreetMap</a> · Copernicus DEM © DLR/Airbus، الاتحاد الأوروبي و ESA'}), 'bottom-right');
map.once('idle', () => { const el = document.querySelector('.maplibregl-ctrl-attrib'); if(el) el.classList.remove('maplibregl-compact-show'); });
map.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-left');
map.addControl(new maplibregl.NavigationControl({visualizePitch:MODE3D}), 'top-left');
const geo = new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}, trackUserLocation:true, showAccuracyCircle:true});
map.addControl(geo, 'top-left');
let myPos = null;
geo.on('geolocate', e => { myPos = [e.coords.longitude, e.coords.latitude]; updateStatus(); });

// ---------- تفعيل المناطق الظاهرة فقط ----------
const active = new Set();
const inBox = (b, x, y) => x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
const overlaps = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
function addRegion(r){
  const [u1, u2] = urls(r);
  map.addSource('vt-' + r.id, {type:'vector', url:'pmtiles://' + u1});
  map.addSource('hs-' + r.id, {type:'raster', url:'pmtiles://' + u2, tileSize:256});
  for(const t of TPL){
    const {id, src, ...def} = t;
    map.addLayer({...def, id:id + '@' + r.id, source:(src === H ? 'hs-' : 'vt-') + r.id}, 'slot:' + id);
  }
  active.add(r.id);
  satFills(r.id);
}
function removeRegion(id){
  for(const t of TPL) if(map.getLayer(t.id + '@' + id)) map.removeLayer(t.id + '@' + id);
  for(const s of ['vt-', 'hs-']) if(map.getSource(s + id)) map.removeSource(s + id);
  active.delete(id);
}
function syncRegions(){
  const b = map.getBounds(), view = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
  const want = new Set(REGIONS.filter(r => overlaps(r.bbox, view)).map(r => r.id));
  for(const id of [...active]) if(!want.has(id)) removeRegion(id);
  for(const r of REGIONS) if(want.has(r.id) && !active.has(r.id)) addRegion(r);
  updateStatus();
}
map.on('load', () => { syncRegions(); if(MODE3D) start3D(); else if(!hasQ) try{ geo.trigger(); }catch(e){} });
// ---------- العرض الثلاثي ----------
function satFills(id){ for(const k of ['sand','farm','park','urban','water']) if(map.getLayer(k + '@' + id)) map.setLayoutProperty(k + '@' + id, 'visibility', SAT ? 'none' : 'visible'); }
function start3D(){
  $('dl').hidden = true; $('td').hidden = false;
  document.title = 'دليل — عرض ثلاثي الأبعاد';
  const ex = () => Number($('tdEx').value);
  map.setTerrain({source:'dem', exaggeration:ex()});
  try{ map.setSky({'sky-color':'#BFD3E2', 'horizon-color':'#EFE4CF', 'fog-color':'#E8D9BD', 'sky-horizon-blend':.6, 'horizon-fog-blend':.6, 'fog-ground-blend':.35}); }catch(e){}
  $('tdSat').checked = SAT;
  $('tdEx').oninput = () => { $('tdExV').textContent = ex().toFixed(1) + '×'; map.setTerrain({source:'dem', exaggeration:ex()}); };
  $('tdSat').onchange = e => { SAT = e.target.checked; map.setLayoutProperty('sat', 'visibility', SAT ? 'visible' : 'none'); for(const id of active) satFills(id); };
  $('tdFlat').onclick = () => { const flat = map.getPitch() > 5; map.easeTo({pitch: flat ? 0 : 62, duration:700}); $('tdFlat').textContent = flat ? 'مائل 3D' : 'مستوٍ 2D'; };
}
map.on('moveend', syncRegions);

// ---------- الحالة وقائمة المناطق ----------
// المنطقة من شبكة المناطق نفسها المستخدمة في التطبيق (data/region-grid.json)، لا من الصناديق المتداخلة
let GRID = null;
fetch('data/region-grid.json?v=1').then(r => r.ok ? r.json() : null).then(g => { GRID = g; updateStatus(); }).catch(() => {});
function regionAt(x, y){
  if(GRID){
    const i = Math.floor((y - GRID.lat0) / GRID.r), j = Math.floor((x - GRID.lng0) / GRID.r);
    const c = i >= 0 && j >= 0 && i < GRID.rows && j < GRID.cols ? GRID.g.charCodeAt(i * GRID.cols + j) - 97 : -1;
    const name = c >= 0 && c < GRID.regions.length ? GRID.regions[c] : null;
    return name ? REGIONS.find(r => r.name === name) : undefined;
  }
  return REGIONS.filter(r => inBox(r.bbox, x, y)).sort((a, b) => (a.bbox[2]-a.bbox[0])*(a.bbox[3]-a.bbox[1]) - (b.bbox[2]-b.bbox[0])*(b.bbox[3]-b.bbox[1]))[0];
}
function updateStatus(){
  const c = map.getCenter(), here = myPos ? regionAt(...myPos) : regionAt(c.lng, c.lat);
  const who = myPos ? 'أنت في منطقة ' : 'المنطقة المعروضة: ';
  $('title').textContent = MODE3D ? 'عرض ثلاثي الأبعاد' + (here ? ' — ' + here.name : '') : 'حفظ الخرائط للبر';
  $('dlSave').hidden = true;
  if(!REGIONS.length) $('dlMsg').textContent = 'تعذّر تحميل قائمة المناطق — افتح الصفحة مع اتصال بالإنترنت.';
  else if(here && saved.has(here.id)) $('dlMsg').innerHTML = '<span class="ok">✓</span> ' + esc(who + here.name) + '، وخريطتها محفوظة في جوالك وتعمل بدون إنترنت.';
  else if(here){
    $('dlMsg').textContent = who + here.name + '. خريطتها غير محفوظة في جوالك بعد.';
    $('dlSave').hidden = false; $('dlSave').dataset.get = here.id;
    if(!$('dlSave').disabled) $('dlSave').textContent = 'احفظ خريطة ' + here.name + ' (' + mb(here.vt + here.hs) + ')';
  }
  else $('dlMsg').textContent = saved.size ? 'محفوظ في جوالك ' + saved.size + ' من ' + REGIONS.length + ' مناطق.' : 'حرّك الخريطة إلى منطقة داخل المملكة، أو اختر من «كل المناطق».';
}
function renderList(){
  const c = map.getCenter(), here = myPos ? regionAt(...myPos) : regionAt(c.lng, c.lat);
  const rows = [...REGIONS].sort((a, b) => (b === here) - (a === here) || a.name.localeCompare(b.name, 'ar'));
  $('list').innerHTML = rows.map(r => `<div class="reg${r === here ? ' here' : ''}"><div class="n"><b>${esc(r.name)}${r === here ? ' · منطقتك' : ''}</b><small>${mb(r.vt + r.hs)}${saved.has(r.id) ? ' · <span class="ok">محفوظة</span>' : ''}</small></div>` +
    (saved.has(r.id) ? `<button class="btn ghost small" data-del="${r.id}" type="button">حذف</button>` : `<button class="btn small" data-get="${r.id}" type="button">تنزيل</button>`) + '</div>').join('');
}
$('dlOpen').onclick = async () => {
  renderList(); $('sheet').hidden = false;
  try{ const e = await navigator.storage.estimate(); $('sheetNote').textContent = 'نزّل منطقتك قبل الخروج للبر. كل منطقة تُحفظ مرة واحدة وتعمل بعدها بدون إنترنت. المساحة المستخدمة: ' + mb(e.usage || 0) + '.'; }catch(e){}
};
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
async function downloadRegion(btn){
  const r = REGIONS.find(x => x.id === btn.dataset.get); if(!r) return;
  btn.disabled = true; btn.textContent = 'جارٍ حفظ ' + r.name + '…';
  try{
    try{ await navigator.storage.persist(); }catch(_){}
    const c = await caches.open(OFFLINE_CACHE);
    for(const u of urls(r)){ const res = await fetch(u, {cache:'no-store'}); if(res.status !== 200) throw new Error(res.status); await c.put(u, res); }
    await attachCached(r);
    if(active.has(r.id)){ removeRegion(r.id); syncRegions(); }   // تبدأ القراءة من الملف المحفوظ فورًا
  }catch(err){ btn.disabled = false; btn.textContent = 'تعذّر الحفظ — أعد المحاولة'; return; }
  btn.disabled = false; renderList(); updateStatus();
}
$('dlSave').onclick = () => downloadRegion($('dlSave'));
$('list').onclick = async e => {
  const g = e.target.closest('[data-get]'), d = e.target.closest('[data-del]');
  if(g) downloadRegion(g);
  else if(d){
    const r = REGIONS.find(x => x.id === d.dataset.del), c = await caches.open(OFFLINE_CACHE);
    for(const u of urls(r)) await c.delete(u);
    saved.delete(r.id); renderList(); updateStatus();
  }
};

// ---------- الضغط على موقع من مواقع دليل ----------
map.on('click', e => {
  const ids = [...active].map(id => 'dalil@' + id).filter(id => map.getLayer(id));
  const f = ids.length && map.queryRenderedFeatures([[e.point.x - 8, e.point.y - 8], [e.point.x + 8, e.point.y + 8]], {layers:ids})[0];
  if(!f) return;
  const p = f.properties, [lng, lat] = f.geometry.coordinates;
  const url = 'index.html?screen=compass&navLat=' + lat.toFixed(6) + '&navLng=' + lng.toFixed(6) + '&navLabel=' + encodeURIComponent(p.name);
  new maplibregl.Popup({offset:10}).setLngLat([lng, lat]).setHTML(
    `<div class="pop"><b>${esc(p.name)}</b><small>${esc(p.kind)}</small>${HAZARD[p.kind] ? `<div class="hz">${esc(HAZARD[p.kind])}</div>` : ''}<a class="btn" href="${url}">توجّه بالبوصلة</a></div>`).addTo(map);
});
updateStatus();
})();
</script>
</body>
