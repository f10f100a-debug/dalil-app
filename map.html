map.addEventListener('touchstart',e=>{if(e.touches.length===1){let t=e.touches[0];drag=true;last=[t.clientX,t.clientY];touchStart={x:t.clientX,y:t.clientY,time:performance.now()};touchMoved=false}else if(e.touches.length===2){pinch0=dist(e.touches);drag=false;touchStart=null;touchMoved=true}},{passive:false});
map.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&drag){let x=e.touches[0].clientX,y=e.touches[0].clientY;if(touchStart&&Math.hypot(x-touchStart.x,y-touchStart.y)>8)touchMoved=true;cx-=x-last[0];cy-=y-last[1];last=[x,y];scheduleRender()}else if(e.touches.length===2&&pinch0){touchMoved=true;let d=dist(e.touches);if(d>pinch0*1.25){zoomTo(z+1);pinch0=d}else if(d<pinch0*.8){zoomTo(z-1);pinch0=d}}},{passive:false});
map.addEventListener('touchend',e=>{if(touchStart&&!touchMoved&&performance.now()-touchStart.time<600){let t=e.changedTouches[0];selectMapPoint(t.clientX,t.clientY)}drag=false;last=null;pinch0=null;touchStart=null});
map.addEventListener('click',e=>{if(!('ontouchstart'in window))selectMapPoint(e.clientX,e.clientY)});window.addEventListener('resize',render);
const queryLat=Number(query.get('lat')),queryLng=Number(query.get('lng'));
if(validLatLng(queryLat,queryLng)){

  else status.textContent=navigator.onLine?'⚠️ الموقع خارج نطاق الأوفلاين — اختر «عبر الإنترنت» لعرضه.':'⚠️ الموقع خارج نطاق خريطة البر الأوفلاين.';
}else if(query.has('lat')||query.has('lng')) status.textContent='⚠️ إحداثية الموقع المحفوظ غير صالحة — ارجع إلى دليل واحفظ الموقع من جديد.';
render();
locateUser(false,!targetPoint);
