<script>

const S=256,minZ=7,maxZ=20,maxLocalZ=11,maxTileZ=10,maxOnlineTileZ=19,ranges={7:[76,82,52,58],8:[152,164,104,116],9:[304,329,208,233],10:[608,659,416,466]};

const tileNodes=new Map(),missingLocalTiles=new Set();let renderFrame=0;

function render(){let online=mapMode==='online',tz=online?Math.min(z,maxOnlineTileZ):Math.min(z,maxTileZ),scale=2**(z-tz),ts=S*scale,r=online?[0,2**tz-1,0,2**tz-1]:ranges[tz],vx0=cx-innerWidth/2-ts,vy0=cy-innerHeight/2-ts,vx1=cx+innerWidth/2+ts,vy1=cy+innerHeight/2+ts,needed=new Set(),fragment=document.createDocumentFragment();

let savedMarks=[];

function detailZ(){return mapMode==='online'?16:maxLocalZ}

window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='DALIL_TRACK_UPDATE')return;loadSavedMarks();let pos=e.data.position,mode=e.data.mode||'view';if(pos&&Number.isFinite(pos.lat)&&Number.isFinite(pos.lng))gps={lat:pos.lat,lng:pos.lng,acc:pos.accuracy};trackPoints=Array.isArray(e.data.points)?e.data.points.filter(p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)):[];let signature=trackPoints.length+':'+(trackPoints[0]?.lat||'')+':'+(trackPoints[trackPoints.length-1]?.lat||'');if((mode==='record'||mode==='retrace')&&gps){z=Math.max(z,detailZ());[cx,cy]=world(gps.lat,gps.lng);embeddedCentered=true}else if(trackPoints.length>1&&signature!==lastTrackSignature){fitTrackClose()}else if(gps&&!embeddedCentered){z=detailZ();[cx,cy]=world(gps.lat,gps.lng);embeddedCentered=true}lastTrackSignature=signature;render()});
