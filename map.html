<script>
const query=new URLSearchParams(location.search);
const isEmbedded=query.get('embed')==='1';
if(isEmbedded)document.body.classList.add('embed');
const S=256,minZ=7,maxZ=20,maxLocalZ=11,maxTileZ=10,maxOnlineTileZ=19,ranges={7:[76,82,52,58],8:[152,164,104,116],9:[304,329,208,233],10:[608,659,416,466]};
const GPS_COURSE_MIN_KMH=5;
let z=7,cx=79*S,cy=55*S,gps=null,targetPoint=null,drag=false,last=null,pinch0=null,touchStart=null,touchMoved=false,trackPoints=[],embeddedCentered=false,lastTrackSignature='',navigationActive=false,deviceHeading=null,orientationHandler=null,lastAbsoluteOrientationAt=0,mapMode='local',missingTileWarningShown=false;
// view: free (المستخدم يحرّك الخريطة) | fit (يُظهر موقعك والهدف معًا) | follow (يتبعك والشمال للأعلى) | heading (يتبعك واتجاهك للأعلى)
let originX=innerWidth/2,originY=innerHeight/2;
let view='free',rot=0,geoWatch=null,gpsCourse=null,gpsCourseAt=0,headingFrame=0;
const $=s=>document.querySelector(s);
const map=$('#map'),stage=$('#stage'),layer=$('#layer'),dot=$('#dot'),accCircle=$('#accCircle'),marksEl=$('#marks'),targetMarker=$('#targetMarker'),trackOverlay=$('#trackOverlay'),status=$('#status'),badge=$('#badge'),navCard=$('#navCard'),navArrow=$('#navArrow'),navName=$('#navName'),navCoords=$('#navCoords'),navInfo=$('#navInfo'),navEta=$('#navEta'),startNav=$('#startNav'),compassNav=$('#compassNav'),stopNav=$('#stopNav'),localMode=$('#localMode'),onlineMode=$('#onlineMode'),googleMode=$('#googleMode'),attribution=$('#attribution'),gpsBtn=$('#gps'),northBtn=$('#northBtn'),northIcon=$('#northIcon');
const tileNodes=new Map(),missingLocalTiles=new Set();
let renderFrame=0;

// ---------- helpers ----------
const iso=v=>'⁦'+v+'⁩';
const setText=(el,v)=>{if(el.textContent!==v)el.textContent=v}; // يمنع انقلاب الأرقام والرموز داخل النص العربي
function world(lat,lng,Z=z){let n=2**Z,x=(lng+180)/360*n*S,r=lat*Math.PI/180,y=(1-Math.asinh(Math.tan(r))/Math.PI)/2*n*S;return[x,y]}
// إحداثيات «المسرح» (قبل الدوران) إلى خط عرض وطول
function stageToLatLng(x,y){let size=2**z*S,wx=cx+x-innerWidth/2,wy=cy+y-innerHeight/2,lng=wx/size*360-180,merc=Math.PI*(1-2*wy/size),lat=Math.atan(Math.sinh(merc))*180/Math.PI;return{lat:Math.max(-85.0511,Math.min(85.0511,lat)),lng:((lng+540)%360)-180}}
// نقطة على الشاشة إلى إحداثيات المسرح، مع مراعاة دوران الخريطة
function screenToStage(x,y){const a=rot*Math.PI/180,dx=x-originX,dy=y-originY;return[originX+dx*Math.cos(a)-dy*Math.sin(a),originY+dx*Math.sin(a)+dy*Math.cos(a)]}
function screenDeltaToStage(dx,dy){const a=rot*Math.PI/180;return[dx*Math.cos(a)-dy*Math.sin(a),dx*Math.sin(a)+dy*Math.cos(a)]}
function validLatLng(lat,lng){return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(Math.abs(lat)<.000001&&Math.abs(lng)<.000001)}
function inOfflineCoverage(lat,lng){let p=world(lat,lng,maxTileZ),x=Math.floor(p[0]/S),y=Math.floor(p[1]/S),r=ranges[maxTileZ];return x>=r[0]&&x<=r[1]&&y>=r[2]&&y<=r[3]}
function distanceMeters(a,b){let R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function targetBearing(a,b){let p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function directionName(b){return['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'][Math.round(b/45)%8]}
function fmtDistance(d){return d>=1000?iso((d/1000).toFixed(d<10000?1:0))+' كم':iso(Math.round(d))+' م'}
function fmtDuration(sec){const m=Math.round(sec/60);if(m<1)return'أقل من دقيقة';if(m<60)return iso(m)+' د';const h=Math.floor(m/60),r=m%60;return iso(h)+' س'+(r?' '+iso(r)+' د':'')}
function coordFormat(){try{const f=localStorage.getItem('dalil_fmt');return f==='dd'||f==='dms'?f:'ddm'}catch(e){return'ddm'}}
function fmtCoords(lat,lng){const fmt=coordFormat();
  const part=(v,isLat)=>{const a=Math.abs(v),d=Math.floor(a),dir=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');if(fmt==='dms'){const mf=(a-d)*60,m=Math.floor(mf);return`${d}°${m}'${((mf-m)*60).toFixed(1)}"${dir}`}return`${d}°${((a-d)*60).toFixed(3)}'${dir}`};
  return fmt==='dd'?lat.toFixed(6)+', '+lng.toFixed(6):part(lat,true)+' '+part(lng,false)}
function smoothHeading(previous,next){if(previous===null)return next;let delta=((next-previous+540)%360)-180,distance=Math.abs(delta);if(distance<.6)return previous;let factor=distance>=45?.92:distance>=15?.78:.62;return(previous+delta*factor+360)%360}
function normRot(){return((rot%360)+360)%360}
function isRotated(){const n=normRot();return n>.5&&n<359.5}

// ---------- heading: GPS course when driving, compass otherwise ----------
function currentHeading(){
  if(gpsCourse!==null&&Date.now()-gpsCourseAt<4000&&gps&&Number.isFinite(gps.speed)&&gps.speed*3.6>GPS_COURSE_MIN_KMH)return gpsCourse;
  return deviceHeading;
}
function setRot(v){rot+=((v-rot)%360+540)%360-180;const r=rot.toFixed(2);stage.style.transform='rotate('+(-rot).toFixed(2)+'deg)';marksEl.style.setProperty('--rot',r);targetMarker.style.setProperty('--rot',r);northIcon.style.transform=`rotate(${(-rot).toFixed(1)}deg)`;const hide=!isRotated()&&view!=='heading';if(northBtn.hidden!==hide)northBtn.hidden=hide}
function onHeadingChanged(){
  if(headingFrame)return;
  headingFrame=requestAnimationFrame(()=>{headingFrame=0;
    const h=currentHeading();
    if(dot.classList.contains('has-heading')!==(h!==null))dot.classList.toggle('has-heading',h!==null);
    if(h!==null)dot.style.setProperty('--hdg',h.toFixed(1));
    if(view==='heading'&&h!==null){const wasRotated=isRotated();setRot(h);if(!wasRotated)render()}
    updateNavigation()});
}
function stopOrientation(){if(!orientationHandler)return;window.removeEventListener('deviceorientationabsolute',orientationHandler,true);window.removeEventListener('deviceorientation',orientationHandler,true);orientationHandler=null;lastAbsoluteOrientationAt=0}
function bindOrientation(){stopOrientation();orientationHandler=e=>{let now=performance.now();if(e.type==='deviceorientationabsolute')lastAbsoluteOrientationAt=now;else if(typeof e.webkitCompassHeading!=='number'&&now-lastAbsoluteOrientationAt<1000)return;let h=null;if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;else if(e.alpha!==null&&e.alpha!==undefined&&!isNaN(e.alpha)){let screenAngle=Number(screen.orientation&&screen.orientation.angle);if(!Number.isFinite(screenAngle))screenAngle=Number(window.orientation)||0;h=360-e.alpha+screenAngle}if(h!==null){deviceHeading=smoothHeading(deviceHeading,(h+360)%360);onHeadingChanged()}};window.addEventListener('deviceorientationabsolute',orientationHandler,true);window.addEventListener('deviceorientation',orientationHandler,true)}
// على iOS يجب أن يأتي طلب الإذن من ضغطة المستخدم؛ إن سبق منحه لا تظهر نافذة.
async function ensureOrientation(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted')return false}}catch(e){return false}bindOrientation();return true}

// ---------- navigation card ----------
function updateNavigation(){
  if(!targetPoint)return;
  if(!navCard.classList.contains('show')){navCard.classList.add('show');document.body.classList.add('has-target');syncNavCardSpace()}
  setText(navCoords,fmtCoords(targetPoint.lat,targetPoint.lng));
  if(!gps){setText(navInfo,'جارٍ تحديد موقعك وحساب المسافة…');setText(navEta,'');return}
  const d=distanceMeters(gps,targetPoint),b=targetBearing(gps,targetPoint),h=currentHeading();
  setText(navInfo,'يبعد '+fmtDistance(d)+' خط مستقيم · '+directionName(b));
  const speed=Number(gps.speed);
  setText(navEta,Number.isFinite(speed)&&speed>1.5&&d>50?'الوصول ≈ '+fmtDuration(d/speed)+' بسرعتك الحالية':(h===null?'السهم حسب أعلى الخريطة':'السهم حسب اتجاه جوالك'));
  const relative=h!==null?b-h:b-rot;
  navArrow.firstElementChild.style.transform=`rotate(${relative.toFixed(1)}deg)`;
}

  if(inOfflineCoverage(queryLat,queryLng)){z=maxLocalZ;[cx,cy]=world(queryLat,queryLng);status.textContent=(query.get('label')||'الموقع المحفوظ')+' — '+iso(fmtCoords(queryLat,queryLng));embeddedCentered=true}
  else status.textContent=navigator.onLine?'الموقع خارج نطاق خريطة البر المحفوظة — اختر «خريطة الإنترنت» لعرضه.':'الموقع خارج نطاق خريطة البر المحفوظة.';
}else if(query.has('lat')||query.has('lng'))status.textContent='إحداثية الموقع المحفوظ غير صالحة — ارجع إلى دليل واحفظ الموقع من جديد.';
loadSavedMarks();
window.addEventListener('storage',()=>{loadSavedMarks();render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadSavedMarks();render()}});
updateOrigin();updateGpsBtn();
// بدون نافذة إذن: يعمل مباشرة في أندرويد، وفي iOS إن سبق منح الإذن.
if(!(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'))bindOrientation();
render();
locateUser(false,!targetPoint);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
