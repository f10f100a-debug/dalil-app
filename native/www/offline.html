<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دليل</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2EFE9;color:#183129;
       font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:340px}
  .ico{font-size:64px;line-height:1}
  h1{font-size:22px;margin:16px 0 8px}
  p{font-size:15px;line-height:1.7;opacity:.85;margin:0 0 20px}
  button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px 28px;background:#183129;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="ico">🧭</div>
  <h1>جارٍ تجهيز دليل…</h1>
  <p>الشبكة ضعيفة الآن. نحاول تلقائيًا كل ثوانٍ قليلة.<br>أول مرة فقط يحتاج دليل اتصالًا ليجهّز نفسه، وبعدها يفتح ويعمل في البر بدون شبكة.</p>
  <button id="rt" onclick="go()">إعادة المحاولة</button>
  <p id="st" style="font-size:13px;margin-top:14px;opacity:.6"></p>
</div>
<script>
var U='https://f10f100a-debug.github.io/dalil-app/',n=0;
function go(){location.replace(U)}
function tick(){n++;document.getElementById('st').textContent='محاولة '+n+'…';fetch(U,{cache:'no-store',mode:'no-cors'}).then(go).catch(function(){})}
setInterval(tick,4000);window.addEventListener('online',go);
</script>
</body>
</html>
